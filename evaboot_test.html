<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Evaboot test</title>
<style>
  body{font-family:system-ui,sans-serif;background:#FAF9F7;color:#1C1B1A;
       max-width:640px;margin:40px auto;padding:0 20px;line-height:1.55}
  h1{font-size:20px;letter-spacing:.06em;text-transform:uppercase}
  h1 span{color:#F68922}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;
        color:#6E7477;font-weight:600;margin:16px 0 4px}
  input{width:100%;padding:10px 12px;font-size:14px;border:1px solid #DFDBD4;
        background:#fff;font-family:inherit}
  button{margin-top:18px;background:#1C1B1A;color:#fff;border:0;padding:11px 22px;
         font-size:14px;text-transform:uppercase;letter-spacing:.09em;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  pre{background:#fff;border:1px solid #DFDBD4;padding:14px;margin-top:20px;
      white-space:pre-wrap;word-break:break-word;font-size:13px}
  .ok{border-left:3px solid #3F7D5C}
  .bad{border-left:3px solid #A6402C}
  p.note{font-size:13px;color:#6E7477}
</style>
</head>
<body>

<h1>HAGGERT<span>Y</span> &nbsp;Evaboot test</h1>
<p class="note">Sends a POST to the extraction webhook. Use a small Sales Navigator
search the first time so it finishes quickly and does not spend credits.</p>

<label for="url">Sales Navigator search URL</label>
<input id="url" type="text" placeholder="https://www.linkedin.com/sales/search/people?..." />

<label for="name">Name this pull</label>
<input id="name" type="text" value="Test pull" />

<button id="go">Start extraction</button>

<pre id="out" hidden></pre>

<script>
const HOOK = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-evaboot-start';
const out = document.getElementById('out');
const btn = document.getElementById('go');

btn.addEventListener('click', async () => {
  const linkedin_url = document.getElementById('url').value.trim();
  const name = document.getElementById('name').value.trim() || 'Test pull';
  if (!linkedin_url) { show('Paste a Sales Navigator URL first.', false); return; }

  btn.disabled = true;
  show('Sending…', true);
  try {
    const res = await fetch(HOOK, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ linkedin_url, name, requested_by: 'liam' })
    });
    const text = await res.text();
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (e) {}
    show('HTTP ' + res.status + '\n\n' + pretty, res.ok);
  } catch (err) {
    show('Request failed: ' + (err.message || err), false);
  } finally {
    btn.disabled = false;
  }
});

function show(msg, good){
  out.hidden = false;
  out.textContent = msg;
  out.className = good ? 'ok' : 'bad';
}
</script>
</body>
</html>
