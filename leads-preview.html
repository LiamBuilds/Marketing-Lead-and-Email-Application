<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leads &middot; HAGGERTY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* These four variables are what leads.js reads from the host page.
     index.html already defines its own, so this block only exists to
     make the preview look right on its own. */
  :root{
    --orange:#F68922;
    --grey:#4D4D4D;
    --rule:#e4e2df;
    --card:#ffffff;
    --display:'Oswald','Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#f7f6f4;color:#1c1c1c;
       font-family:'Lato',-apple-system,'Segoe UI',Roboto,sans-serif}
  .topbar{display:flex;align-items:baseline;gap:14px;background:#fff;
          border-bottom:1px solid var(--rule);padding:14px 20px}
  .wordmark{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.02em}
  .wordmark i{color:var(--orange);font-style:normal}
  .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);opacity:.7}
  .out{margin-left:auto;background:none;border:0;color:var(--orange);
       font-size:12.5px;cursor:pointer;text-decoration:underline}
  .center{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .loginbox{width:100%;max-width:340px;background:#fff;border:1px solid var(--rule);padding:28px 26px}
  .loginbox h1{font-family:var(--display);font-size:22px;margin:0 0 18px;font-weight:700}
  .loginbox label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
                  color:var(--grey);margin:12px 0 5px}
  .loginbox input{width:100%;font-size:14px;padding:8px 10px;border:1px solid var(--rule)}
  .loginbox button{width:100%;margin-top:18px;background:var(--orange);border:1px solid var(--orange);
                   color:#fff;font-weight:700;font-size:13px;padding:9px;cursor:pointer}
  .loginerr{color:#96271c;font-size:12.5px;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { leadsPage, mountLeads } from './leads.js';

/* Confirm these two match the constants at the top of index.html. */
const SUPABASE_URL = 'https://ekatzukprjpisdiwubjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bdyRB7Mx0BKzNj1EcYlRCg_8JLDXEIL';

const sb  = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');

function shell(inner){
  return '<header class="topbar">' +
    '<span class="wordmark">HAGGERTY<i>.</i></span>' +
    '<span class="tag">Leads preview</span>' +
    '<button class="out" id="signout">Sign out</button>' +
  '</header>' + inner;
}

function renderLogin(msg){
  app.innerHTML =
    '<header class="topbar"><span class="wordmark">HAGGERTY<i>.</i></span>' +
    '<span class="tag">Leads preview</span></header>' +
    '<div class="center"><div class="loginbox">' +
      '<h1>Sign in</h1>' +
      '<label for="em">Email</label><input id="em" type="email" autocomplete="username">' +
      '<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">' +
      '<button id="go">Sign in</button>' +
      (msg ? '<p class="loginerr">' + msg + '</p>' : '') +
    '</div></div>';

  const go = async () => {
    const email = document.getElementById('em').value.trim();
    const password = document.getElementById('pw').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return renderLogin(error.message);
    boot();
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin('');

  app.innerHTML = shell(leadsPage());
  document.getElementById('signout').onclick = async () => {
    await sb.auth.signOut();
    location.reload();
  };
  mountLeads(sb);
}

boot();
</script>
</body>
</html>
