<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HAGGERTY Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B1A;
    --paper:#FAF9F7;
    --card:#FFFFFF;
    --rule:#DFDBD4;
    --rule-soft:#EDEAE5;
    --grey:#4D4D4D;
    --slate:#6E7477;
    --orange:#F68922;
    --orange-tint:#FEF3E7;
    --green:#3F7D5C;
    --red:#A6402C;

    --display:"Barlow Condensed",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  a{color:var(--grey)}

  .eyebrow{
    font-family:var(--display);
    text-transform:uppercase;
    letter-spacing:.09em;
    font-weight:600;
    font-size:13px;
    color:var(--slate);
  }
  .mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}

  /* ---------- shell ---------- */
  .topbar{
    display:flex;align-items:baseline;gap:20px;
    padding:16px 24px;
    border-bottom:1px solid var(--rule);
    background:var(--card);
    position:sticky;top:0;z-index:20;
  }
  .wordmark{
    font-family:var(--display);
    font-weight:700;
    font-size:22px;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .wordmark span{color:var(--orange)}
  .topbar .sub{
    font-family:var(--display);
    text-transform:uppercase;
    letter-spacing:.1em;
    font-size:14px;
    color:var(--slate);
    font-weight:600;
  }
  .topbar .spacer{flex:1}
  .tally{font-family:var(--mono);font-size:12px;color:var(--slate)}
  .tally b{color:var(--ink);font-weight:500}
  .linkbtn{
    background:none;border:none;color:var(--slate);
    font-size:13px;cursor:pointer;padding:4px 6px;text-decoration:underline;
  }
  .linkbtn:hover{color:var(--ink)}

  .layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 57px)}

  /* ---------- board list ---------- */
  .board{border-right:1px solid var(--rule);background:var(--card)}
  .board-head{
    padding:14px 18px 10px;
    border-bottom:1px solid var(--rule-soft);
  }
  .row{
    display:block;width:100%;text-align:left;
    background:none;border:0;border-bottom:1px solid var(--rule-soft);
    padding:13px 18px 13px 16px;cursor:pointer;
    border-left:3px solid transparent;
  }
  .row:hover{background:#FBFAF8}
  .row.active{background:var(--orange-tint);border-left-color:var(--orange)}
  .row.done .name{color:var(--slate)}
  .row-top{display:flex;align-items:baseline;gap:8px}
  .idx{font-family:var(--mono);font-size:11px;color:var(--slate);min-width:18px}
  .name{font-weight:600;font-size:14px;letter-spacing:-.005em}
  .org{
    font-size:12.5px;color:var(--slate);margin-left:26px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tick{margin-left:auto;color:var(--green);font-size:13px}

  /* ---------- detail ---------- */
  .detail{padding:26px 30px 80px;max-width:840px}
  .who h1{
    font-family:var(--display);
    font-size:34px;font-weight:700;letter-spacing:.005em;
    margin:0 0 2px;line-height:1.1;
  }
  .who .role{color:var(--grey);font-size:15px}
  .who .org-line{
    margin-top:2px;font-size:14px;color:var(--slate);
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
  .chip{
    font-family:var(--mono);font-size:11px;
    border:1px solid var(--rule);border-radius:2px;
    padding:3px 7px;color:var(--slate);background:var(--card);
  }
  .chip.hot{border-color:var(--orange);color:#8A4A05;background:var(--orange-tint)}

  .context{
    margin:20px 0 26px;padding:14px 16px;
    background:var(--card);border:1px solid var(--rule);
  }
  .context p{margin:6px 0 0;font-size:13.5px;color:var(--grey)}
  .context .none{color:var(--slate);font-style:italic}

  .options-head{
    display:flex;align-items:baseline;gap:10px;
    margin:0 0 12px;padding-bottom:8px;
    border-bottom:2px solid var(--ink);
  }

  /* ---------- option cards ---------- */
  .opt{
    background:var(--card);
    border:1px solid var(--rule);
    border-left:3px solid var(--rule);
    margin-bottom:10px;
  }
  .opt.open{border-left-color:var(--grey)}
  .opt.chosen{border-left-color:var(--orange);box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .opt-head{
    display:flex;align-items:center;gap:10px;width:100%;
    background:none;border:0;padding:12px 14px;cursor:pointer;text-align:left;
  }
  .opt-n{font-family:var(--mono);font-size:11px;color:var(--slate)}
  .opt-label{
    font-family:var(--display);text-transform:uppercase;
    letter-spacing:.08em;font-weight:600;font-size:13px;
  }
  .opt-subject{
    flex:1;font-size:13px;color:var(--slate);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .opt-body{padding:0 14px 14px;border-top:1px solid var(--rule-soft)}
  .field{margin-top:12px}
  .field label{
    display:block;font-family:var(--display);text-transform:uppercase;
    letter-spacing:.08em;font-size:12px;color:var(--slate);
    font-weight:600;margin-bottom:4px;
  }
  input[type=text],textarea{
    width:100%;font-family:var(--body);font-size:14px;line-height:1.6;
    color:var(--ink);background:var(--paper);
    border:1px solid var(--rule);border-radius:0;
    padding:9px 11px;resize:vertical;
  }
  input[type=text]:focus,textarea[type]:focus,textarea:focus{
    outline:2px solid var(--orange);outline-offset:-1px;border-color:var(--orange);
  }
  textarea{min-height:190px}
  .opt-actions{display:flex;align-items:center;gap:12px;margin-top:14px}
  .btn{
    font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
    font-weight:600;font-size:14px;
    background:var(--ink);color:#fff;border:0;
    padding:10px 20px;cursor:pointer;
  }
  .btn:hover{background:#000}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:none;color:var(--slate);border:1px solid var(--rule)}
  .btn.ghost:hover{background:var(--paper);color:var(--ink)}
  .hint{font-size:12.5px;color:var(--slate)}
  .hint.err{color:var(--red)}

  .done-banner{
    background:var(--card);border:1px solid var(--rule);
    border-left:3px solid var(--green);
    padding:16px 18px;margin-bottom:18px;
  }
  .done-banner .eyebrow{color:var(--green)}
  .done-banner p{margin:6px 0 0;font-size:14px;color:var(--grey)}

  /* ---------- states ---------- */
  .center{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .panel{
    width:100%;max-width:360px;background:var(--card);
    border:1px solid var(--rule);padding:30px 28px;
  }
  .panel .wordmark{font-size:26px;display:block;margin-bottom:4px}
  .panel .eyebrow{margin-bottom:22px;display:block}
  .panel .field{margin-top:14px}
  .panel .btn{width:100%;margin-top:20px}
  .empty{padding:60px 30px;max-width:520px}
  .empty h2{font-family:var(--display);font-size:26px;margin:0 0 6px;font-weight:700}
  .empty p{color:var(--grey);font-size:14.5px;margin:0 0 4px}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    .board{border-right:0;border-bottom:1px solid var(--rule)}
    .detail{padding:20px 18px 60px}
  }
  @media (prefers-reduced-motion:no-preference){
    .opt{transition:border-left-color .18s ease}
    .row{transition:background .12s ease}
  }
</style>
</head>
<body>

<div id="app"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL  = 'https://ekatzukprjpisdiwubjq.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_bdyRB7Mx0BKzNj1EcYlRCg_8JLDXEIL';
const ACTION_URL    = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-outreach-action';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');

const LABELS = {
  direct_bid:       'Direct bid request',
  routing_question: 'Who handles GC selection',
  project_anchor:   'Anchored to past work',
  local_proximity:  'Local angle',
  plain_intro:      'Introduction only'
};

const state = { board: [], drafts: {}, activeId: null, open: {}, busy: false, err: '' };

const esc = s => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;');

const today = () => {
  const d = new Date();
  return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
};

const prettyDate = () =>
  new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

// Strip the signature and HTML tags so Pat edits prose, not markup.
function toPlain(html){
  if(!html) return '';
  let s = String(html);
  const cut = s.indexOf('<table');
  if(cut > -1) s = s.slice(0, cut);
  return s
    .replace(/<\/p>/gi,'\n\n')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&nbsp;/g,' ')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}

function toHtml(plain){
  const paras = String(plain||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  return paras.map(p =>
    '<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 14px 0;">'
    + esc(p).replace(/\n/g,'<br>') + '</p>'
  ).join('');
}

/* ---------------- auth ---------------- */

function renderLogin(msg){
  app.innerHTML = `
    <div class="center"><form class="panel" id="loginForm">
      <span class="wordmark">HAGGERT<span>Y</span></span>
      <span class="eyebrow">Outreach board</span>
      <div class="field">
        <label for="em">Email</label>
        <input type="text" id="em" autocomplete="username" />
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="current-password"
               style="width:100%;font-family:var(--body);font-size:14px;padding:9px 11px;border:1px solid var(--rule);background:var(--paper)" />
      </div>
      ${msg ? `<p class="hint err" style="margin-top:14px">${esc(msg)}</p>` : ''}
      <button class="btn" type="submit">Sign in</button>
    </form></div>`;
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('em').value.trim();
    const password = document.getElementById('pw').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return renderLogin(error.message);
    boot();
  });
}

/* ---------------- data ---------------- */

async function load(){
  const { data: board, error } = await sb
    .from('v_today_board')
    .select('*')
    .eq('queue_date', today())
    .order('vertical_order')
    .order('slot');
  if (error) throw error;

  state.board = board || [];
  state.drafts = {};

  if (state.board.length){
    const ids = state.board.map(r => r.queue_id);
    const { data: drafts, error: e2 } = await sb
      .from('email_drafts')
      .select('*')
      .in('queue_id', ids)
      .order('variant_number');
    if (e2) throw e2;
    for (const d of (drafts||[])){
      (state.drafts[d.queue_id] ||= []).push(d);
    }
  }

  if (!state.activeId || !state.board.some(r => r.queue_id === state.activeId)){
    const next = state.board.find(r => !r.handled) || state.board[0];
    state.activeId = next ? next.queue_id : null;
    state.open = {};
    const first = state.activeId && state.drafts[state.activeId]?.[0];
    if (first) state.open[first.id] = true;
  }
}

/* ---------------- render ---------------- */

function render(){
  const done = state.board.filter(r => r.handled).length;
  const total = state.board.length;

  if (!total){
    app.innerHTML = topbar(0,0) + `
      <div class="empty">
        <h2>Nothing queued for today</h2>
        <p>The board fills at 6:15am on weekdays, after the overnight queue picks who to approach.</p>
        <p class="hint" style="margin-top:10px">If it is a weekday morning and this is still empty, check the queue builder and draft generator in n8n.</p>
      </div>`;
    wireTop();
    return;
  }

  app.innerHTML = topbar(done, total) + `
    <div class="layout">
      <nav class="board">
        <div class="board-head"><span class="eyebrow">${done} of ${total} cleared</span></div>
        ${state.board.map(rowHtml).join('')}
      </nav>
      <main class="detail">${detailHtml()}</main>
    </div>`;

  wireTop();
  document.querySelectorAll('[data-row]').forEach(el =>
    el.addEventListener('click', () => {
      state.activeId = el.dataset.row;
      state.open = {};
      const first = state.drafts[state.activeId]?.[0];
      if (first) state.open[first.id] = true;
      state.err = '';
      render();
    }));
  document.querySelectorAll('[data-toggle]').forEach(el =>
    el.addEventListener('click', () => {
      const id = el.dataset.toggle;
      state.open[id] = !state.open[id];
      render();
    }));
  document.querySelectorAll('[data-use]').forEach(el =>
    el.addEventListener('click', () => useDraft(el.dataset.use)));
}

function topbar(done, total){
  return `<header class="topbar">
    <span class="wordmark">HAGGERT<span>Y</span></span>
    <span class="sub">Outreach board</span>
    <span class="spacer"></span>
    <span class="tally">${esc(prettyDate())}</span>
    ${total ? `<span class="tally"><b>${done}</b> / ${total} cleared</span>` : ''}
    <button class="linkbtn" id="signout">Sign out</button>
  </header>`;
}

function wireTop(){
  const b = document.getElementById('signout');
  if (b) b.addEventListener('click', async () => { await sb.auth.signOut(); renderLogin(); });
}

function rowHtml(r, i){
  const active = r.queue_id === state.activeId;
  return `<button class="row ${active?'active':''} ${r.handled?'done':''}" data-row="${r.queue_id}">
    <span class="row-top">
      <span class="idx">${String(i+1).padStart(2,'0')}</span>
      <span class="name">${esc(r.full_name || r.email)}</span>
      ${r.handled ? '<span class="tick">&#10003;</span>' : ''}
    </span>
    <span class="org">${esc(r.company_name || r.vertical)}</span>
  </button>`;
}

function detailHtml(){
  const r = state.board.find(x => x.queue_id === state.activeId);
  if (!r) return '';
  const drafts = state.drafts[r.queue_id] || [];

  const chips = [
    r.vertical && `<span class="chip">${esc(r.vertical)}</span>`,
    r.territory && `<span class="chip">${esc(r.territory)}</span>`,
    r.company_city && `<span class="chip">${esc(r.company_city)}${r.company_state?', '+esc(r.company_state):''}</span>`,
    r.employee_count && `<span class="chip">${esc(r.employee_count)} staff</span>`,
    r.fit >= 60 && `<span class="chip hot">Strong fit ${esc(r.fit)}</span>`,
    r.linkedin_url && `<a class="chip" href="${esc(r.linkedin_url)}" target="_blank" rel="noopener">LinkedIn</a>`,
    r.company_website && `<a class="chip" href="${esc(r.company_website)}" target="_blank" rel="noopener">Website</a>`
  ].filter(Boolean).join('');

  const ctx = r.company_description || r.company_keywords || r.company_industry;

  const head = `
    <div class="who">
      <h1>${esc(r.full_name || 'Unknown contact')}</h1>
      <div class="role">${esc(r.title || 'No title on file')}</div>
      <div class="org-line">${esc(r.company_name || '')} &middot; <span class="mono">${esc(r.email)}</span></div>
      <div class="chips">${chips}</div>
    </div>
    <div class="context">
      <span class="eyebrow">What we know</span>
      ${ctx ? `
        ${r.company_industry ? `<p><b>Industry</b> ${esc(r.company_industry)}</p>` : ''}
        ${r.company_description ? `<p>${esc(r.company_description)}</p>` : ''}
        ${r.company_keywords ? `<p class="mono" style="color:var(--slate)">${esc(r.company_keywords)}</p>` : ''}
      ` : `<p class="none">No enrichment on file. The drafts below make no claims about this company.</p>`}
    </div>`;

  if (r.handled){
    return head + `
      <div class="done-banner">
        <span class="eyebrow">Cleared</span>
        <p>The draft is waiting in your Outlook drafts folder. Review it there and send when you are ready.</p>
        ${r.draft_web_link ? `<p style="margin-top:10px"><a href="${esc(r.draft_web_link)}" target="_blank" rel="noopener"><b>Open the draft in Outlook</b></a></p>` : ''}
      </div>`;
  }

  if (!drafts.length){
    return head + `<div class="context"><p class="none">No drafts generated for this contact yet.</p></div>`;
  }

  return head + `
    <div class="options-head">
      <span class="eyebrow" style="color:var(--ink)">Five approaches</span>
      <span class="hint">Pick one, edit it, send it to your drafts</span>
    </div>
    ${drafts.map(optHtml).join('')}
    ${state.err ? `<p class="hint err">${esc(state.err)}</p>` : ''}`;
}

function optHtml(d, i){
  const open = !!state.open[d.id];
  const subject = d.edited_subject || d.subject || '';
  const bodyPlain = toPlain(d.edited_body || d.body_html);
  return `<section class="opt ${open?'open':''}">
    <button class="opt-head" data-toggle="${d.id}">
      <span class="opt-n">${String(i+1).padStart(2,'0')}</span>
      <span class="opt-label">${esc(LABELS[d.variant_type] || d.variant_type)}</span>
      <span class="opt-subject">${esc(subject)}</span>
    </button>
    ${open ? `
    <div class="opt-body">
      <div class="field">
        <label for="s-${d.id}">Subject</label>
        <input type="text" id="s-${d.id}" value="${esc(subject)}" />
      </div>
      <div class="field">
        <label for="b-${d.id}">Message</label>
        <textarea id="b-${d.id}">${esc(bodyPlain)}</textarea>
      </div>
      <div class="opt-actions">
        <button class="btn" data-use="${d.id}" ${state.busy?'disabled':''}>
          ${state.busy ? 'Sending&hellip;' : 'Send to my drafts'}
        </button>
        <span class="hint">Greeting and signature are added automatically.</span>
      </div>
    </div>` : ''}
  </section>`;
}

/* ---------------- action ---------------- */

async function useDraft(draftId){
  if (state.busy) return;
  const r = state.board.find(x => x.queue_id === state.activeId);
  const d = (state.drafts[r.queue_id] || []).find(x => x.id === draftId);
  if (!r || !d) return;

  const subject = document.getElementById('s-'+draftId).value.trim();
  const bodyText = document.getElementById('b-'+draftId).value.trim();
  if (!subject || !bodyText){
    state.err = 'Add a subject and a message before sending.';
    return render();
  }

  state.busy = true; state.err = ''; render();

  try {
    const greeting = '<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 14px 0;">Hi '
      + esc(r.first_name || (r.full_name||'').split(' ')[0]) + ',</p>';
    const signoff = '<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 4px 0;">Pat</p>';
    const sigStart = (d.body_html || '').indexOf('<table');
    const signature = sigStart > -1 ? d.body_html.slice(sigStart) : '';

    const finalHtml = greeting + toHtml(bodyText) + signoff + signature;

    const { error: upErr } = await sb.from('email_drafts')
      .update({ edited_subject: subject, edited_body: finalHtml })
      .eq('id', draftId);
    if (upErr) throw upErr;

    const res = await fetch(ACTION_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ queue_id: r.queue_id, draft_id: draftId })
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.ok) throw new Error(out.error || 'The draft could not be created. Try again.');

    await load();
  } catch (err){
    state.err = err.message || String(err);
  } finally {
    state.busy = false;
    render();
  }
}

/* ---------------- boot ---------------- */

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  try { await load(); render(); }
  catch (e){
    app.innerHTML = `<div class="empty"><h2>Could not load the board</h2>
      <p>${esc(e.message || e)}</p>
      <p class="hint" style="margin-top:12px">If this mentions permissions, your account may not have access yet.</p></div>`;
  }
}

boot();
</script>
</body>
</html>
