<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HAGGERTY Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B1A; --paper:#FAF9F7; --card:#FFFFFF;
    --rule:#DFDBD4; --rule-soft:#EDEAE5; --wash:#F6F4F1;
    --grey:#4D4D4D; --slate:#6E7477;
    --orange:#F68922; --orange-tint:#FEF3E7;
    --green:#3F7D5C; --red:#A6402C;
    --display:"Barlow Condensed",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  a{color:var(--grey)}

  .eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
           font-weight:600;font-size:13px;color:var(--slate)}
  .mono{font-family:var(--mono);font-size:12px}
  .muted{color:var(--slate)}
  .hint{font-size:12.5px;color:var(--slate)}
  .hint.err{color:var(--red)}

  /* ---------- chrome ---------- */
  .topbar{display:flex;align-items:center;gap:16px;padding:12px 22px;
          border-bottom:1px solid var(--rule);background:var(--card);
          position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .wordmark{font-family:var(--display);font-weight:700;font-size:21px;
            letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
  .wordmark span{color:var(--orange)}
  .tabs{display:flex;gap:1px;flex-wrap:wrap}
  .tab{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;
       font-weight:600;font-size:14px;color:var(--slate);
       background:none;border:0;border-bottom:2px solid transparent;
       padding:6px 11px 5px;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--orange)}
  .spacer{flex:1}
  .tally{font-family:var(--mono);font-size:12px;color:var(--slate);white-space:nowrap}
  .tally b{color:var(--ink);font-weight:500}
  .linkbtn{background:none;border:none;color:var(--slate);font-size:13px;
           cursor:pointer;padding:4px 6px;text-decoration:underline}
  .linkbtn:hover{color:var(--ink)}

  .page{padding:24px 26px 90px;max-width:1240px}
  .page.wide{max-width:none}
  h2.sec{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
         font-size:15px;font-weight:700;margin:0 0 10px;
         padding-bottom:7px;border-bottom:2px solid var(--ink)}
  .block{margin-bottom:28px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .cols3{display:grid;grid-template-columns:1.4fr 1fr;gap:26px}
  @media (max-width:960px){.cols,.cols3{grid-template-columns:1fr}}

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule)}
  th{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
     font-size:11.5px;color:var(--slate);font-weight:600;text-align:left;
     padding:8px 12px;border-bottom:1px solid var(--rule)}
  td{padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--rule-soft)}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-family:var(--mono);font-size:12.5px}
  .bar{height:6px;background:var(--rule-soft);position:relative;min-width:50px;display:block}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--orange)}

  /* ---------- stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
             gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:28px}
  .stat{background:var(--card);padding:15px 17px}
  .stat .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
           font-size:12px;color:var(--slate);font-weight:600}
  .stat .v{font-family:var(--display);font-size:31px;font-weight:700;line-height:1.15;margin-top:2px}
  .stat .v small{font-size:15px;color:var(--slate);font-weight:600}
  .stat.accent .v{color:var(--orange)}

  /* ---------- board ---------- */
  .split{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 54px)}
  .board{border-right:1px solid var(--rule);background:var(--card)}
  .board-head{padding:13px 17px 9px;border-bottom:1px solid var(--rule-soft)}
  .row{display:block;width:100%;text-align:left;background:none;border:0;
       border-bottom:1px solid var(--rule-soft);padding:12px 17px 12px 15px;
       cursor:pointer;border-left:3px solid transparent}
  .row:hover{background:#FBFAF8}
  .row.active{background:var(--orange-tint);border-left-color:var(--orange)}
  .row.done .name{color:var(--slate)}
  /* Pat's Gold: hand-picked, so it has to read differently at a glance from
     a scraped lead. Filled cell rather than a left rule, because the left
     rule already means "this row is open". */
  .row.gold{background:var(--orange-tint)}
  .row.gold .name::after{content:'GOLD';font-family:var(--mono);font-size:9px;
      letter-spacing:.08em;color:var(--orange);margin-left:7px;vertical-align:1px}
  .row.gold.active{background:#FBE3C9}
  .row-top{display:flex;align-items:baseline;gap:8px}
  .idx{font-family:var(--mono);font-size:11px;color:var(--slate);min-width:18px}
  .name{font-weight:600;font-size:14px}
  .org{font-size:12.5px;color:var(--slate);margin-left:26px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tick{margin-left:auto;color:var(--green);font-size:13px}

  .who h1{font-family:var(--display);font-size:32px;font-weight:700;margin:0 0 2px;line-height:1.1}
  .who .role{color:var(--grey);font-size:15px}
  .who .org-line{margin-top:2px;font-size:14px;color:var(--slate)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0 0}
  .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);
        padding:3px 7px;color:var(--slate);background:var(--card);text-decoration:none}
  .chip.hot{border-color:var(--orange);color:#8A4A05;background:var(--orange-tint)}
  .chip.good{border-color:var(--green);color:var(--green)}
  .chip.bad{border-color:var(--red);color:var(--red)}
  .panelbox{margin:18px 0 24px;padding:13px 15px;background:var(--card);border:1px solid var(--rule)}
  .panelbox p{margin:6px 0 0;font-size:13.5px;color:var(--grey)}
  .panelbox .none{color:var(--slate);font-style:italic}

  .opt{background:var(--card);border:1px solid var(--rule);
       border-left:3px solid var(--rule);margin-bottom:10px}
  .opt.open{border-left-color:var(--grey)}
  .opt-head{display:flex;align-items:center;gap:10px;width:100%;background:none;
            border:0;padding:11px 13px;cursor:pointer;text-align:left}
  .opt-n{font-family:var(--mono);font-size:11px;color:var(--slate)}
  .opt-label{font-family:var(--display);text-transform:uppercase;
             letter-spacing:.08em;font-weight:600;font-size:13px}
  .opt-subject{flex:1;font-size:13px;color:var(--slate);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt-body{padding:0 13px 13px;border-top:1px solid var(--rule-soft)}
  .field{margin-top:12px}
  .field label{display:block;font-family:var(--display);text-transform:uppercase;
               letter-spacing:.08em;font-size:12px;color:var(--slate);
               font-weight:600;margin-bottom:4px}
  input[type=text],input[type=password],textarea,select{
    width:100%;font-family:var(--body);font-size:14px;line-height:1.6;
    color:var(--ink);background:var(--paper);border:1px solid var(--rule);
    border-radius:0;padding:9px 11px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--orange);outline-offset:-1px}
  textarea{min-height:180px}
  .actions{display:flex;align-items:center;gap:12px;margin-top:13px;flex-wrap:wrap}
  .btn{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
       font-weight:600;font-size:14px;background:var(--ink);color:#fff;border:0;
       padding:9px 18px;cursor:pointer}
  .btn:hover{background:#000}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.small{font-size:12.5px;padding:6px 12px}
  .btn.ghost{background:none;color:var(--grey);border:1px solid var(--rule)}
  .btn.ghost:hover{background:var(--wash);color:var(--ink)}
  .btn.accent{background:var(--orange)}
  .btn.accent:hover{background:#DE7A16}
  .done-banner{background:var(--card);border:1px solid var(--rule);
               border-left:3px solid var(--green);padding:15px 17px;margin-bottom:18px}
  .done-banner .eyebrow{color:var(--green)}
  .done-banner p{margin:6px 0 0;font-size:14px;color:var(--grey)}

  /* ---------- tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--rule);
        padding:14px 15px;display:flex;flex-direction:column;gap:2px}
  .tile.live{border-top-color:var(--orange)}
  .tile h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
           font-size:16px;font-weight:700;margin:0}
  .tile .pool{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
  .tile .pool small{font-size:13px;color:var(--slate);font-weight:600;letter-spacing:.04em}
  .tile .meta{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:2px}
  .tile .foot{margin-top:11px;display:flex;align-items:center;gap:8px}
  .tile.empty{opacity:.62}

  /* ---------- calendar ---------- */
  .day{border-top:1px solid var(--rule);background:var(--card)}
  .day:first-child{border-top:0}
  .day-head{display:flex;align-items:baseline;gap:10px;padding:9px 14px 7px;
            background:var(--wash);border-bottom:1px solid var(--rule-soft)}
  .day-head .d{font-family:var(--display);text-transform:uppercase;
               letter-spacing:.08em;font-weight:700;font-size:13px}
  .day-head .n{font-family:var(--mono);font-size:11px;color:var(--slate)}
  .day-head.today .d{color:var(--orange)}
  .ev{display:flex;align-items:baseline;gap:12px;padding:9px 14px;
      border-bottom:1px solid var(--rule-soft)}
  .ev:last-child{border-bottom:0}
  .ev .t{font-family:var(--mono);font-size:12px;color:var(--slate);min-width:62px;flex-shrink:0}
  .ev .s{flex:1;font-size:13.5px}
  .ev .s em{font-style:normal;color:var(--slate);font-size:12.5px}
  .kind{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
        letter-spacing:.05em;padding:2px 6px;border:1px solid var(--rule);
        color:var(--slate);flex-shrink:0}
  .kind.meeting{border-color:var(--orange);color:#8A4A05;background:var(--orange-tint)}
  .kind.networking{border-color:var(--green);color:var(--green)}
  .kind.site_visit{border-color:var(--ink);color:var(--ink)}
  .scroll{max-height:560px;overflow-y:auto;border:1px solid var(--rule)}
  .scroll.short{max-height:330px}

  /* ---------- tasks ---------- */
  .task{display:flex;align-items:flex-start;gap:11px;padding:10px 13px;
        background:var(--card);border:1px solid var(--rule);
        border-left:3px solid var(--rule);margin-bottom:7px}
  .task.doing{border-left-color:var(--orange);background:var(--orange-tint)}
  .task.done{border-left-color:var(--green);opacity:.6}
  .task.done .tt{text-decoration:line-through}
  .box{width:17px;height:17px;border:1.5px solid var(--slate);background:none;
       cursor:pointer;flex-shrink:0;margin-top:2px;padding:0;line-height:1}
  .task.done .box{background:var(--green);border-color:var(--green);color:#fff;font-size:11px}
  .task .mid{flex:1;min-width:0}
  .tt{font-size:14px}
  .tmeta{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:2px}
  .pri1{color:var(--red);font-weight:500}
  .taskbar{display:grid;grid-template-columns:1fr 130px 96px auto;gap:8px;
           margin-bottom:16px;align-items:end}
  @media (max-width:700px){.taskbar{grid-template-columns:1fr}}

  /* ---------- warnings ---------- */
  .warn{background:var(--card);border:1px solid var(--rule);
        border-left:3px solid var(--red);padding:10px 13px;margin-bottom:8px;
        font-size:13.5px;color:var(--grey)}
  .warn b{color:var(--red)}
  .warn.soft{border-left-color:var(--orange)}
  .warn.soft b{color:#8A4A05}
  .warn.info{border-left-color:var(--slate)}
  .warn.info b{color:var(--ink)}
  .warn .when{font-family:var(--mono);font-size:11.5px;color:var(--slate)}
  .prev{margin-top:14px;border:1px solid var(--rule);background:var(--card)}
  .prev-head{padding:9px 13px;border-bottom:1px solid var(--rule-soft);
             display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .prev-body{padding:4px 13px 10px;max-height:280px;overflow-y:auto;
             font-size:13px;color:#555}
  .prev-body p{margin:0 0 10px}

  /* ---------- deal board ---------- */
  .kswitch{display:flex;gap:1px}
  .kswitch button{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
                  font-weight:600;font-size:13px;background:none;border:1px solid var(--rule);
                  color:var(--slate);padding:6px 14px;cursor:pointer}
  .kswitch button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .bwrap{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:16px}
  .bcol{flex:0 0 244px;background:var(--wash);border:1px solid var(--rule)}
  .bcol-head{padding:9px 11px 8px;background:var(--card);border-bottom:1px solid var(--rule)}
  .bcol-head h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;
                font-size:13.5px;font-weight:700;margin:0;white-space:nowrap;
                overflow:hidden;text-overflow:ellipsis}
  .bcol-head .m{font-family:var(--mono);font-size:11px;color:var(--slate);display:block;margin-top:1px}
  .bcol-body{padding:8px;display:flex;flex-direction:column;gap:7px;
             max-height:60vh;overflow-y:auto}
  .bcol-body .none{font-size:12px;color:var(--slate);font-style:italic;padding:6px 2px}
  .dcard{display:block;width:100%;text-align:left;background:var(--card);cursor:grab;
         border:1px solid var(--rule);border-left:3px solid var(--rule);padding:9px 10px}
  .dcard:hover{background:#FBFAF8}
  .dcard:active{cursor:grabbing}
  .dcard.dragging{opacity:.35}
  .bcol.over{outline:2px solid var(--orange);outline-offset:-2px;background:var(--orange-tint)}
  .bcol.over .bcol-body{min-height:60px}
  .dcard.mine{border-left-color:var(--orange)}
  .dcard h5{font-size:13.5px;font-weight:600;margin:0 0 2px;line-height:1.3}
  .dcard .who{font-size:12px;color:var(--slate);line-height:1.35}
  .dcard .val{font-family:var(--mono);font-size:12px;margin-top:5px}
  .orghit{display:block;width:100%;text-align:left;background:none;border:0;
          border-bottom:1px solid var(--rule-soft);padding:7px 9px;cursor:pointer;font-size:13px}
  .orghit:hover{background:var(--wash)}

  /* ---------- sector strip ---------- */
  .sectorbar{display:flex;gap:8px;overflow-x:auto;padding:11px 26px;
             background:var(--card);border-bottom:1px solid var(--rule)}
  .sec-tile{flex:0 0 auto;min-width:132px;background:var(--card);
            border:1px solid var(--rule);border-top:3px solid var(--rule);padding:8px 11px 9px}
  .sec-tile.live{border-top-color:var(--orange)}
  .sec-tile.all{border-top-color:var(--ink)}
  .sec-tile.gold{border-top-color:var(--orange);background:var(--orange-tint)}
  .sec-tile.gold.on{background:var(--orange);border-color:var(--orange)}
  .sec-tile.gold.on h4,.sec-tile.gold.on .n{color:#fff}
  .sec-tile.gold.on .n small{color:#FBE3C9}
  .sec-tile h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;
               font-size:12.5px;font-weight:700;margin:0;white-space:nowrap}
  .sec-tile .n{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.15}
  .sec-tile .n small{font-family:var(--mono);font-size:10.5px;color:var(--slate);font-weight:400}
  .sec-tile .btn{margin-top:6px;width:100%}
  @media (max-width:820px){ .sectorbar{padding:10px 16px} }

  /* ---------- leads ---------- */
  .filters{display:flex;gap:4px;flex-wrap:wrap}
  .filt{font-family:var(--mono);font-size:12px;background:none;cursor:pointer;
        border:1px solid var(--rule);padding:5px 10px;color:var(--slate)}
  .filt.on{border-color:var(--orange);color:var(--ink);background:var(--orange-tint)}
  .filt b{font-weight:500;margin-left:6px;opacity:.7}

  .lead{display:grid;grid-template-columns:36px 1fr;background:var(--card);
        border:1px solid var(--rule);border-left:3px solid var(--rule);margin-bottom:9px}
  .lead.keep{border-left-color:var(--orange)}
  .lead.flag{border-left-color:var(--red)}
  .lead.gold{border-left-color:var(--orange);background:var(--orange-tint)}

  /* Event invites */
  .kswitch .dot{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;
      border-radius:8px;background:var(--orange);color:#fff;
      font-family:var(--mono);font-size:10px;line-height:16px;text-align:center}
  .fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .fchip{border:1px solid var(--line);background:#fff;padding:5px 11px;
      font-size:12px;cursor:pointer;color:var(--slate)}
  .fchip b{font-family:var(--mono);margin-left:4px;color:var(--ink)}
  .fchip.on{border-color:var(--ink);color:var(--ink)}
  .inv-list{display:flex;flex-direction:column;gap:10px}
  .inv{border:1px solid var(--line);border-left:3px solid var(--line);
      background:#fff;padding:14px 16px}
  .inv.busy{opacity:.55}
  .inv.going{border-left-color:var(--orange)}
  .inv.passed{opacity:.55}
  .inv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .inv-head h4{margin:0;font-size:15px}
  .inv-org{color:var(--slate);font-size:12px;margin-top:2px}
  .ebadge{font-family:var(--mono);font-size:10px;letter-spacing:.06em;
      border:1px solid var(--line);padding:3px 7px;white-space:nowrap;color:var(--slate)}
  .ebadge.soon{border-color:var(--orange);color:var(--orange)}
  .ebadge.past{border-color:var(--line);color:var(--slate)}
  .inv-facts{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:8px}
  .inv-sum{margin:8px 0 0;font-size:13px;line-height:1.5}
  .inv-lvl{margin-top:8px;font-size:12px;color:var(--slate)}
  .inv-lvl b{color:var(--ink)}
  .inv-foot{display:flex;justify-content:space-between;align-items:center;
      gap:10px;margin-top:12px;flex-wrap:wrap}
  .inv-acts{display:flex;gap:5px;flex-wrap:wrap}
  .inv-links{display:flex;gap:6px;align-items:center}
  .inv-box{font-family:var(--mono);font-size:10px;color:var(--slate)}
  .chip.gold{border-color:var(--orange);background:var(--orange);color:#fff}
  .lead .pick{display:flex;align-items:flex-start;justify-content:center;
              padding-top:16px;cursor:pointer}
  .lead .pick input{width:16px;height:16px;accent-color:var(--orange);cursor:pointer;margin:0}
  tr.picked td{background:var(--orange-tint)}
  .sorth{font:inherit;background:none;border:0;padding:0;cursor:pointer;
         color:var(--slate);text-transform:inherit;letter-spacing:inherit}
  .sorth:hover{color:var(--ink)}
  .sorth.on{color:var(--ink)}
  th .sorth{font-family:var(--display);text-transform:uppercase;
            letter-spacing:.07em;font-size:11.5px;font-weight:600}
  .lead .lbody{padding:13px 15px 12px 0;min-width:0}
  .lhead{display:flex;align-items:flex-start;gap:10px}
  .lhead h3{font-family:var(--display);font-size:20px;font-weight:700;margin:0;line-height:1.15}
  .lhead .role{font-size:13px;color:var(--slate);margin-top:1px}
  .fit{font-family:var(--display);font-size:23px;font-weight:700;color:var(--orange);
       margin-left:auto;line-height:1;flex-shrink:0}
  .facts{display:flex;flex-wrap:wrap;gap:0 22px;margin:11px 0 0}
  .facts dt{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
            font-size:11px;color:var(--slate);font-weight:600}
  .facts dd{margin:0;font-size:13.5px}
  .more{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule-soft)}

<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ekatzukprjpisdiwubjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bdyRB7Mx0BKzNj1EcYlRCg_8JLDXEIL';
const ACTION_URL   = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-outreach-action';
const GENERATE_URL = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-generate-vertical';
const IMPORT_URL   = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-lead-import';
const APPROVE_URL  = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-lead-approve';
const REJECT_URL   = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-lead-reject';
const MOVE_URL     = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-deal-move';
const ADDDEAL_URL  = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-deal-add';

/* Approving creates an organisation, a person and a note per contact, in
   sequence, behind one request. Forty leads in a single POST is a hundred
   and twenty Pipedrive calls and the gateway gives up long before that
   finishes. Eight at a time stays well inside the timeout and lets the
   screen report progress as it goes. */
const APPROVE_CHUNK = 8;

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');

const LABELS = {
  direct_bid:'Direct bid request', routing_question:'Who handles GC selection',
  project_anchor:'Anchored to past work', local_proximity:'Local angle',
  plain_intro:'Introduction only'
};
const KIND = { meeting:'Meeting', networking:'Event', site_visit:'Site visit',
               internal:'Internal', other:'Block' };

const PAGES = [
  ['today','Outreach'], ['calendar',"Pat's Calendar"],
  ['kpis','Pipeline & KPIs'], ['myday',"Liam's Day"], ['leads','Leads']
];

const S = {
  page:'today', board:[], drafts:{}, activeId:null, open:{},
  busy:false, err:'', gen:'', metrics:null, week:null, tiles:null, goldOnly:false, goldPool:0,
  tasks:null, dayStatus:null, seq:null, loaded:{},
  /* leads */
  batches:null, leads:null, verticals:[], batchId:'all', leadFilter:'all',
  picked:new Set(), leadOpen:{}, leadNote:'', leadErr:'', leadProg:null,
  impOpen:false, impBusy:false, impRows:null, impFile:'', impName:'',
  impVert:'', impErr:'',
  /* classifications */
  leadView:'leads', cls:null, clsFilter:'not_fit', clsPicked:new Set(),
  clsBusy:false, clsNote:'', clsErr:'',
  clsSearch:'', clsSort:'contacts', clsDir:'desc', clsSearching:false,
  /* kpis */
  kpi:null, kpiEdit:false, kpiBusy:false, kpiErr:'', kpiNote:'',
  /* board */
  kpiView:'scorecard', boardPipe:null, dealId:null, dealBusy:false, dealErr:'',
  calView:'schedule', invites:null, inviteFilter:'open', inviteBusy:'', inviteErr:'',
  addOpen:false, addForm:{}, orgQuery:'', orgHits:[], orgBusy:false
};

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = n => (n===null||n===undefined) ? '0' : Number(n).toLocaleString('en-US');
const money = n => '$' + Math.round(Number(n||0)).toLocaleString('en-US');
const today = () => { const d=new Date();
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'); };
const prettyDate = () => new Date().toLocaleDateString('en-US',
  {weekday:'long',month:'long',day:'numeric'});
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-US',
  {hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'});
const dayKey = iso => new Date(iso).toLocaleDateString('en-US',
  {weekday:'short',month:'short',day:'numeric',timeZone:'America/Los_Angeles'});
const fmtDay = iso => {
  if(!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-US',
    {weekday:'short',month:'short',day:'numeric',year:'numeric',
     timeZone:'America/Los_Angeles'});
};
const shortDate = iso => {
  if(!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
};

function toPlain(html){
  if(!html) return '';
  let s = String(html);
  const cut = s.indexOf('<table');
  if(cut>-1) s = s.slice(0,cut);
  return s.replace(/<\/p>/gi,'\n\n').replace(/<br\s*\/?>/gi,'\n')
    .replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/\n{3,}/g,'\n\n').trim();
}
function toHtml(plain){
  return String(plain||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)
    .map(p=>'<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 14px 0;">'
      + esc(p).replace(/\n/g,'<br>') + '</p>').join('');
}

/* ================= auth ================= */
function renderLogin(msg){
  app.innerHTML = `<div class="center"><form class="loginbox" id="lf">
    <span class="wordmark">HAGGERT<span>Y</span></span>
    <span class="eyebrow">Marketing hub</span>
    <div class="field"><label for="em">Email</label><input type="text" id="em" autocomplete="username"/></div>
    <div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password"/></div>
    ${msg?`<p class="hint err" style="margin-top:14px">${esc(msg)}</p>`:''}
    <button class="btn" type="submit">Sign in</button></form></div>`;
  document.getElementById('lf').addEventListener('submit', async e=>{
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({
      email:document.getElementById('em').value.trim(),
      password:document.getElementById('pw').value });
    if(error) return renderLogin(error.message);
    boot();
  });
}

/* ================= loaders ================= */
async function loadBoard(){
  const { data, error } = await sb.from('v_today_board').select('*')
    .eq('queue_date', today()).order('vertical_order').order('slot');
  if(error) throw error;
  S.board = data || [];
  S.drafts = {};
  if(S.board.length){
    const { data:d } = await sb.from('email_drafts').select('*')
      .in('queue_id', S.board.map(r=>r.queue_id)).order('variant_number');
    for(const x of (d||[])) (S.drafts[x.queue_id] ||= []).push(x);
  }
  if(!S.activeId || !S.board.some(r=>r.queue_id===S.activeId)){
    const next = S.board.find(r=>!r.handled) || S.board[0];
    S.activeId = next ? next.queue_id : null;
    S.open = {};
    const f = S.activeId && S.drafts[S.activeId]?.[0];
    if(f) S.open[f.id] = true;
  }
  S.loaded.board = true;
}

async function loadTiles(){
  const { data } = await sb.from('v_dash_tiles').select('*').order('sort_order');
  S.tiles = data || [];

  /* Gold is not a row in v_dash_tiles, because it crosses every sector.
     This is an approximate pool: approved, has an address, not a client.
     The full guard set only runs server side when the button is pressed,
     so the tile can read a little high. */
  const { count } = await sb.from('contacts')
    .select('id', { count: 'exact', head: true })
    .eq('is_gold', true).eq('status', 'approved')
    .not('email', 'is', null).eq('is_client', false);
  S.goldPool = count || 0;

  S.loaded.tiles = true;
}

async function loadWeek(){
  const { data } = await sb.from('v_dash_week').select('*');
  S.week = data || [];
  S.loaded.week = true;
}

async function loadInvites(){
  const { data, error } = await sb.from('v_event_invites').select('*');
  if(error) S.inviteErr = error.message;
  S.invites = data || [];
  S.loaded.invites = true;
}

async function decideInvite(id, decision){
  if(S.inviteBusy) return;
  S.inviteBusy = id; S.inviteErr=''; render();
  let who = null;
  try{ const { data } = await sb.auth.getUser(); who = data && data.user ? data.user.email : null; }
  catch(e){ who = null; }

  const { error } = await sb.from('event_invites')
    .update({ decision: decision,
              decided_at: new Date().toISOString(),
              decided_by: who })
    .eq('id', id);
  if(error) S.inviteErr = error.message;
  S.loaded.invites = false;
  await loadInvites();
  S.inviteBusy=''; render();
}

async function loadMetrics(){
  const [head, daily, vert, variant, pipe, cover, recent, weekT] = await Promise.all([
    sb.from('v_dash_headline').select('*').single(),
    sb.from('v_dash_daily').select('*'),
    sb.from('v_email_vertical_stats').select('*'),
    sb.from('v_variant_performance').select('*'),
    sb.from('v_dash_pipeline').select('*'),
    sb.from('v_vertical_coverage').select('*'),
    sb.from('v_dash_recent').select('*'),
    sb.from('v_dash_week_totals').select('*').single()
  ]);
  S.metrics = {
    head: head.data || {}, daily: daily.data || [], vert: vert.data || [],
    variant: variant.data || [], pipe: pipe.data || [], cover: cover.data || [],
    recent: recent.data || [], weekT: weekT.data || {}
  };
  S.loaded.metrics = true;
}

async function loadSequences(){
  const { data } = await sb.from('v_sequences_live').select('*')
    .is('halted_because', null).order('next_due_on').limit(40);
  S.seq = data || [];
  S.loaded.seq = true;
}

async function loadTasks(){
  const [t, st] = await Promise.all([
    sb.from('tasks').select('*').eq('work_date', today())
      .order('status').order('priority').order('sort_order'),
    sb.from('v_day_status').select('*').eq('work_date', today())
  ]);
  S.tasks = t.data || [];
  S.dayStatus = (st.data && st.data[0]) || null;
  S.loaded.tasks = true;
}

async function loadKpis(){
  const yr = new Date().getFullYear();
  const [score, quarters, monthly, outcomes, open, stages, targets, manual,
         cols, board, users] = await Promise.all([
    sb.from('v_kpi_scorecard').select('*').order('sort_order'),
    sb.from('v_kpi_quarters').select('*').order('quarter'),
    sb.from('v_kpi_monthly').select('*').order('month'),
    sb.from('v_kpi_outcomes').select('*').single(),
    sb.from('v_kpi_open').select('*').single(),
    sb.from('v_kpi_stages').select('*').order('order_nr'),
    sb.from('kpi_targets').select('*').order('sort_order'),
    sb.from('kpi_manual').select('*').eq('year', yr).order('quarter'),
    sb.from('v_board_columns').select('*').order('order_nr'),
    sb.from('v_deal_board').select('*').eq('status','open'),
    sb.from('pipedrive_users').select('*').eq('active', true)
  ]);
  S.kpi = {
    score: score.data || [], quarters: quarters.data || [],
    monthly: monthly.data || [], outcomes: outcomes.data || {},
    open: open.data || {}, stages: stages.data || [],
    targets: targets.data || [], manual: manual.data || [], year: yr,
    cols: cols.data || [], board: board.data || [], users: users.data || []
  };
  if(!S.boardPipe){
    const pref = (S.kpi.targets.find(t=>t.pipeline_name)||{}).pipeline_name;
    S.boardPipe = pref || (S.kpi.cols[0]||{}).pipeline_name || null;
  }
  S.loaded.kpis = true;
}

async function loadVerticals(){
  const { data } = await sb.from('verticals').select('slug,name').order('name');
  S.verticals = data || [];
  if(!S.impVert && S.verticals.length) S.impVert = S.verticals[0].slug;
  S.loaded.verticals = true;
}

async function loadClassifications(){
  // Ordered by what it costs to be wrong: most contacts first, then
  // least confident. A twenty-contact firm rejected at 60% is the
  // expensive mistake. A one-person venture fund at 95% is not.
  try{
    // With five thousand companies the list is a window, so the search
    // has to hit the database rather than filter the window. Otherwise
    // it reports nothing for a company that is plainly there, which is
    // worse than having no search at all.
    const q = String(S.clsSearch || '').trim();
    let sel = sb.from('v_classify_pending').select('*');
    if(S.clsFilter && S.clsFilter !== 'all') sel = sel.eq('outcome', S.clsFilter);
    if(q.length >= 2){
      const like = '%' + q.replace(/[%,()]/g, ' ') + '%';
      sel = sel.or('company_name.ilike.' + like + ',domain.ilike.' + like
                 + ',reason.ilike.' + like);
    }
    const { data, error } = await sel
      .order('contacts', {ascending:false})
      .order('confidence', {ascending:true})
      .limit(600);
    if(error) throw error;
    S.cls = data || [];
  }catch(err){
    // Patch 26 may not be applied yet, and the lead board must not
    // stop rendering because a secondary view is missing.
    S.cls = [];
    S.clsErr = 'Classifications are unavailable. ' + (err.message || err);
  }
  S.clsPicked = new Set();
  S.loaded.cls = true;
}

async function loadBatches(){
  const { data, error } = await sb.from('v_batch_summary').select('*')
    .order('created_at',{ascending:false}).limit(60);
  if(error) throw error;
  S.batches = data || [];
}

async function loadLeadRows(){
  let q = sb.from('v_lead_review').select('*');
  if(S.batchId !== 'all') q = q.eq('lead_batch_id', S.batchId);
  const { data, error } = await q.order('fit',{ascending:false})
    .order('created_at',{ascending:false}).limit(600);
  if(error) throw error;
  S.leads = data || [];
  /* Approving most and dropping a few is the normal shape of a review,
     so everything starts kept. */
  S.picked = new Set(S.leads.map(l=>l.contact_id));
  S.leadOpen = {};
  S.loaded.leads = true;
}

async function ensure(page){
  if(page==='today'){
    if(!S.loaded.board) await loadBoard();
    if(!S.loaded.tiles) await loadTiles();
    if(!S.loaded.week) await loadWeek();
    if(!S.loaded.tasks) await loadTasks();
    if(!S.loaded.seq) await loadSequences();
  }
  if(page==='calendar' && !S.loaded.week) await loadWeek();
  if(page==='calendar' && !S.loaded.invites) await loadInvites();
  if(page==='kpis'){
    if(!S.loaded.kpis) await loadKpis();
    if(!S.loaded.metrics) await loadMetrics();
  }
  if(page==='myday' && !S.loaded.tasks) await loadTasks();
  if(page==='leads'){
    if(!S.loaded.verticals) await loadVerticals();
    if(!S.loaded.leads){ await loadBatches(); await loadLeadRows(); }
    if(!S.loaded.cls) await loadClassifications();
  }
}

/* ================= chrome ================= */
function topbar(){
  const done = S.board.filter(r=>r.handled).length;
  return `<header class="topbar">
    <span class="wordmark">HAGGERT<span>Y</span></span>
    <nav class="tabs">
      ${PAGES.map(([k,l])=>`<button class="tab ${S.page===k?'on':''}" data-page="${k}">${l}</button>`).join('')}
    </nav>
    <span class="spacer"></span>
    <span class="tally">${esc(prettyDate())}</span>
    ${S.board.length?`<span class="tally"><b>${done}</b> / ${S.board.length} cleared</span>`:''}
    <button class="linkbtn" id="signout">Sign out</button>
  </header>`;
}

function wireChrome(){
  document.querySelectorAll('[data-page]').forEach(el=>
    el.addEventListener('click', async ()=>{
      S.page = el.dataset.page; S.err=''; S.gen='';
      render();
      try{ await ensure(S.page); }
      catch(err){ S.err = 'Could not load this tab. ' + (err.message || err); }
      render();
    }));
  const b = document.getElementById('signout');
  if(b) b.addEventListener('click', async ()=>{ await sb.auth.signOut(); renderLogin(); });
}

function render(){
  let inner = '';
  if(S.page==='today')    inner = pageToday();
  if(S.page==='calendar') inner = pageCalendar();
  if(S.page==='kpis')     inner = pageKpis();
  if(S.page==='myday')    inner = pageMyDay();
  if(S.page==='leads')    inner = pageLeads();
  app.innerHTML = topbar() + inner;
  wireChrome();
  wirePage();
}

function wirePage(){
  document.querySelectorAll('[data-row]').forEach(el=>
    el.addEventListener('click',()=>{
      S.activeId = el.dataset.row; S.open={}; S.err='';
      const f = S.drafts[S.activeId]?.[0]; if(f) S.open[f.id]=true;
      render();
    }));
  document.querySelectorAll('[data-toggle]').forEach(el=>
    el.addEventListener('click',()=>{ const id=el.dataset.toggle; S.open[id]=!S.open[id]; render(); }));
  document.querySelectorAll('[data-use]').forEach(el=>
    el.addEventListener('click',()=>useDraft(el.dataset.use)));
  document.querySelectorAll('[data-stop]').forEach(el=>
    el.addEventListener('click',()=>stopFollowUp(el.dataset.stop, el.dataset.stopnow === '1')));
  document.querySelectorAll('[data-gen]').forEach(el=>
    el.addEventListener('click',()=>generate(Number(el.dataset.gen), 5)));
  const all = document.getElementById('genAll');
  if(all) all.addEventListener('click', generateAcross);
  const gf = document.getElementById('goldFilt');
  if(gf) gf.addEventListener('click',()=>{ S.goldOnly=!S.goldOnly; render(); });
  const gg = document.getElementById('genGold');
  if(gg) gg.addEventListener('click',()=>generate(null, 5, true));
  const add = document.getElementById('addTask');
  if(add) add.addEventListener('click', addTask);
  const ti = document.getElementById('taskTitle');
  if(ti) ti.addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });
  document.querySelectorAll('[data-task-toggle]').forEach(el=>
    el.addEventListener('click',()=>cycleTask(el.dataset.taskToggle)));
  document.querySelectorAll('[data-task-del]').forEach(el=>
    el.addEventListener('click',()=>delTask(el.dataset.taskDel)));
  const ex = document.getElementById('exportCsv');
  if(ex) ex.addEventListener('click', exportCsv);
  const pr = document.getElementById('printPage');
  if(pr) pr.addEventListener('click', ()=>window.print());
  const ke = document.getElementById('kpiEdit');
  if(ke) ke.addEventListener('click', ()=>{ S.kpiEdit=!S.kpiEdit; S.kpiErr=''; S.kpiNote=''; render(); });
  const kc = document.getElementById('kpiCancel');
  if(kc) kc.addEventListener('click', ()=>{ S.kpiEdit=false; S.kpiErr=''; render(); });
  const ks = document.getElementById('kpiSave');
  if(ks) ks.addEventListener('click', saveKpiTargets);
  wireBoard();
  wireLeads();
}

/* ================= today ================= */
function pageToday(){
  if(!S.loaded.board) return loading();
  const todayEvents = (S.week||[]).filter(e => dayKey(e.starts_at)===dayKey(new Date().toISOString()));
  const ds = S.dayStatus;

  const side = `
    <div class="block">
      <h2 class="sec">Today's calendar</h2>
      ${todayEvents.length ? `<div style="border:1px solid var(--rule)">${todayEvents.map(evRow).join('')}</div>`
        : `<p class="hint">Nothing on the calendar today.</p>`}
    </div>
    <div class="block">
      <h2 class="sec">Follow-ups coming</h2>
      ${seqPanel()}
    </div>
    <div class="block">
      <h2 class="sec">My day</h2>
      ${ds ? `
        <div class="panelbox">
          <div style="display:flex;align-items:baseline;gap:10px">
            <span style="font-family:var(--display);font-size:26px;font-weight:700">${num(ds.done)}<small style="font-size:15px;color:var(--slate)"> / ${num(ds.total)}</small></span>
            <span class="eyebrow">${ds.pct_done!=null?ds.pct_done+'% done':''}</span>
          </div>
          ${ds.current_focus ? `<p><b>Now:</b> ${esc(ds.current_focus)}</p>` : ''}
          ${ds.open_areas ? `<p class="mono muted">Open: ${esc(ds.open_areas)}</p>` : ''}
        </div>`
        : `<p class="hint">No tasks set for today.</p>`}
    </div>`;

  if(!S.board.length){
    return sectorBar() + `<div class="page cols3"><div>
      <div class="empty" style="padding:34px 0">
        <h2>Nothing queued for today</h2>
        <p>The board fills at 6:15am on weekdays. Pull a sector from the strip above to start now.</p>
      </div></div><div>${side}</div></div>`;
  }

  const done = S.board.filter(r=>r.handled).length;
  const shownRows = S.goldOnly ? S.board.filter(r=>r.is_gold) : S.board;
  return sectorBar() + `<div class="split">
    <nav class="board">
      <div class="board-head"><span class="eyebrow">${done} of ${S.board.length} cleared${
        S.goldOnly?` &middot; showing Pat's Gold only`:''}</span></div>
      ${shownRows.map(rowHtml).join('')}
    </nav>
    <main class="page cols3">
      <div>${detailHtml()}</div>
      <div>${side}</div>
    </main></div>`;
}

function loading(){ return `<div class="empty"><h2>Loading</h2></div>`; }

/* Nothing else shows a sequence between the send and the nudge, so a
   working sequence and a broken one looked identical for four days. */
function seqPanel(){
  const rows = S.seq || [];
  if(!rows.length){
    return `<p class="hint">No sequences running. One starts every time an email sends.</p>`;
  }
  const due = rows.filter(r => Number(r.days_until) <= 0).length;
  const shown = rows.slice(0, 8);
  return `<div class="panelbox" style="margin-top:0">
      <div style="display:flex;align-items:baseline;gap:10px">
        <span style="font-family:var(--display);font-size:26px;font-weight:700">${num(rows.length)}</span>
        <span class="eyebrow">waiting on a reply</span>
      </div>
      ${due?`<p class="mono" style="color:var(--orange)">${due} due now</p>`:''}
    </div>
    <div style="border:1px solid var(--rule)">
      ${shown.map(r=>{
        const d = Number(r.days_until);
        const when = d < 0 ? `${Math.abs(d)}d overdue` : d === 0 ? 'today'
                   : d === 1 ? 'tomorrow' : `in ${d}d`;
        return `<div class="ev">
          <span class="t" style="color:${d<=0?'var(--orange)':'var(--slate)'}">${esc(when)}</span>
          <span class="s">${esc(r.full_name||'')}
            ${r.company_name?`<em>${esc(r.company_name)}</em>`:''}</span>
          <span class="kind">Touch ${esc(r.next_touch)}</span>
        </div>`;
      }).join('')}
    </div>
    ${rows.length>8?`<p class="hint">${rows.length-8} more.</p>`:''}`;
}

function rowHtml(r,i){
  return `<button class="row ${r.queue_id===S.activeId?'active':''} ${r.handled?'done':''} ${r.is_gold?'gold':''}" data-row="${r.queue_id}">
    <span class="row-top"><span class="idx">${String(i+1).padStart(2,'0')}</span>
    <span class="name">${esc(r.full_name||r.email)}</span>
    ${r.handled?'<span class="tick">&#10003;</span>':''}</span>
    <span class="org">${esc(r.company_name||r.vertical)}</span></button>`;
}

function warnBlock(r){
  const w = [];

  // Ordered by how badly it would land, not by how likely it is.
  if(r.is_internal){
    w.push(`<div class="warn"><b>This is a HAGGERTY address.</b>
      Nobody internal should be on this board. Worth checking the import
      rather than the contact.</div>`);
  }

  if(r.meeting_subject){
    const when = r.meeting_at ? new Date(r.meeting_at) : null;
    const past = when && when < new Date();
    const day = when ? when.toLocaleDateString('en-US',
      {weekday:'long', month:'short', day:'numeric'}) : '';
    w.push(`<div class="warn"><b>Pat ${past?'met':'is meeting'} ${
      r.meeting_is_them ? 'them' : 'someone at this company'} ${past?'on':''} ${esc(day)}.</b>
      <span class="when">${esc(r.meeting_subject)}</span><br>
      A cold introduction ${past?'after that meeting':'before that meeting'} would read badly.</div>`);
  }

  if(r.open_deal_title){
    w.push(`<div class="warn"><b>There is an open deal with this company.</b>
      ${esc(r.open_deal_title)}${r.open_deal_stage?` <span class="when">${esc(r.open_deal_stage)}</span>`:''}<br>
      Asking to be added to their bid list says nobody here talks to anyone.</div>`);
  }

  if(r.colleague_emailed_name){
    const d = Number(r.colleague_emailed_days_ago);
    w.push(`<div class="warn soft"><b>${esc(r.colleague_emailed_name)} at the same company was emailed ${
      d === 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'}.</b><br>
      They forward each other's mail. Two similar notes from Pat read as the mail merge they are.</div>`);
  }

  if(r.maybe_competitor){
    w.push(`<div class="warn soft"><b>Possibly a competing contractor.</b>
      The industry data mentions general contracting. Subcontractors look the same in that field,
      so this is worth a look rather than an assumption.</div>`);
  }

  if(r.follow_up_stopped_at){
    w.push(`<div class="warn info"><b>Follow-ups are stopped for this contact.</b>
      ${r.follow_up_stopped_reason?esc(r.follow_up_stopped_reason)+'. ':''}Sending here is still fine,
      but no automatic nudge will go out.</div>`);
  }

  return w.join('');
}

function prevEmail(r){
  if(!r.parent_send_id || !r.parent_body_html) return '';
  const d = Number(r.parent_days_ago);
  const open = !!S.open['prev-' + r.queue_id];
  return `<div class="prev">
    <div class="prev-head">
      <span class="eyebrow" style="flex:1">What Pat sent ${
        d === 1 ? 'yesterday' : d + ' days ago'}</span>
      <button class="linkbtn" data-toggle="prev-${esc(r.queue_id)}">${open?'Hide':'Read it'}</button>
    </div>
    ${open?`<div class="prev-body">${r.parent_body_html}</div>`:''}
  </div>`;
}

async function stopFollowUp(contactId, stop){
  let reason = '';
  if(stop){
    reason = prompt('Why stop following up? Optional, but useful in a month.\n\nFor example: spoke on the phone, or asked not to be contacted.') || '';
    if(reason === null) return;
  }
  S.busy = true; S.err = ''; render();
  try{
    const { error } = await sb.from('contacts').update({
      follow_up_stopped_at: stop ? new Date().toISOString() : null,
      follow_up_stopped_reason: stop ? (reason.trim() || null) : null,
      updated_at: new Date().toISOString()
    }).eq('id', contactId);
    if(error) throw error;
    await loadBoard();
  }catch(err){ S.err = err.message || String(err); }
  finally{ S.busy = false; render(); }
}

function detailHtml(){
  const r = S.board.find(x=>x.queue_id===S.activeId);
  if(!r) return '';
  const drafts = S.drafts[r.queue_id]||[];
  const chips = [
    r.vertical && `<span class="chip">${esc(r.vertical)}</span>`,
    r.territory && `<span class="chip">${esc(r.territory)}</span>`,
    r.company_city && `<span class="chip">${esc(r.company_city)}${r.company_state?', '+esc(r.company_state):''}</span>`,
    r.employee_count && `<span class="chip">${esc(r.employee_count)} staff</span>`,
    r.fit>=60 && `<span class="chip hot">Strong fit ${esc(r.fit)}</span>`,
    r.linkedin_url && `<a class="chip" href="${esc(r.linkedin_url)}" target="_blank" rel="noopener">LinkedIn</a>`,
    r.company_website && `<a class="chip" href="${esc(r.company_website)}" target="_blank" rel="noopener">Website</a>`
  ].filter(Boolean).join('');
  const ctx = r.company_description || r.company_keywords || r.company_industry;
  const isFollow = Number(r.touch) > 1;
  const head = `<div class="who"><h1>${esc(r.full_name||'Unknown contact')}</h1>
    <div class="role">${esc(r.title||'No title on file')}</div>
    <div class="org-line">${esc(r.company_name||'')} &middot; <span class="mono">${esc(r.email)}</span></div>
    <div class="chips">${chips}${isFollow?`<span class="chip hot">Follow-up ${esc(r.touch)}</span>`:''}</div></div>
    ${warnBlock(r) ? `<div style="margin-top:16px">${warnBlock(r)}</div>` : ''}
    ${prevEmail(r)}
    <div class="panelbox"><span class="eyebrow">What we know</span>
    ${ctx?`${r.company_industry?`<p><b>Industry</b> ${esc(r.company_industry)}</p>`:''}
      ${r.company_description?`<p>${esc(r.company_description)}</p>`:''}
      ${r.company_keywords?`<p class="mono muted">${esc(r.company_keywords)}</p>`:''}`
     :`<p class="none">No enrichment on file. The drafts below make no claims about this company.</p>`}
    </div>`;
  if(r.handled){
    return head + `<div class="done-banner"><span class="eyebrow">Cleared</span>
      <p>Sent from Pat's mailbox. It will show in his Sent Items.</p>
      ${r.draft_web_link?`<p style="margin-top:9px"><a href="${esc(r.draft_web_link)}" target="_blank" rel="noopener"><b>Open it in Outlook</b></a></p>`:''}

  }
  if(!drafts.length) return head + `<div class="panelbox"><p class="none">No drafts generated for this contact yet.</p></div>`;
  return head + `<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <h2 class="sec" style="flex:1;min-width:180px">${
        isFollow ? 'The nudge' : 'Five approaches'}</h2>
      <button class="linkbtn" data-stop="${esc(r.contact_id)}" data-stopnow="${r.follow_up_stopped_at?'0':'1'}">
        ${r.follow_up_stopped_at ? 'Resume follow-ups' : 'Stop following up'}</button>
    </div>
    ${drafts.map(optHtml).join('')}
    ${S.err?`<p class="hint err">${esc(S.err)}</p>`:''}`;
}

   the board to fetch more work and coming back. The pools live above the

    <div class="sec-tile all">
      <h4>Every sector</h4>
      <div class="n">${num(tiles.reduce((a,t)=>a+Number(t.pool||0),0))}<small> ready</small></div>

    </div>
    ${(()=>{

function calSwitch(){
  const open = (S.invites||[]).filter(i=>i.decision==='undecided' && !i.is_past).length;
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <div class="kswitch">
      <button data-cview="schedule" class="${S.calView==='schedule'?'on':''}">Schedule</button>
      <button data-cview="invites" class="${S.calView==='invites'?'on':''}">Invites${
        open?` <span class="dot">${open}</span>`:''}</button>
    </div>
  </div>`;
}

function pageCalendar(){
  if(S.calView==='invites') return pageInvites();
  if(!S.loaded.week) return loading();
  const w = S.week || [];
  if(!w.length){
    return `<main class="page">${calSwitch()}<div class="empty"><h2>No events</h2>
      <p>Nothing on the calendar for the next two weeks. If that looks wrong, run the calendar sync in n8n.</p>
    </div></main>`;
  }
  const counts = {};
  for(const e of w) counts[e.event_type] = (counts[e.event_type]||0)+1;
  const stats = Object.keys(KIND).filter(k=>counts[k]).map(k=>
    `<div class="stat"><div class="k">${KIND[k]}</div><div class="v">${counts[k]}</div></div>`).join('');

  const days = [];
  for(const e of w){
    const k = dayKey(e.starts_at);
    let d = days.find(x=>x.key===k);
    if(!d){ d={key:k,items:[]}; days.push(d); }
    d.items.push(e);
  }
  const tk = dayKey(new Date().toISOString());

  return `<main class="page">
    ${calSwitch()}
    <div class="stat-grid">${stats}</div>
    <div class="block"><h2 class="sec">The next two weeks</h2>
      <div>${days.map(d=>`<div class="day">
        <div class="day-head ${d.key===tk?'today':''}">
          <span class="d">${esc(d.key===tk?'Today':d.key)}</span>
          <span class="n">${d.items.length}</span></div>
        ${d.items.map(evRow).join('')}
      </div>`).join('')}</div>
    </div></main>`;
}

/* ---------- Event invites ---------------------------------------------- */

function inviteRow(v){
  const busy = S.inviteBusy === v.id;

  /* Sorted and coloured by deadline, not by event date. An event four months
     out with an RSVP closing Friday is the one that bites. */
  let badge = '';
  const d = v.days_left;
  if(v.is_past){
    badge = `<span class="ebadge past">Passed</span>`;
  }else if(d !== null && d !== undefined){
    const cls = d < 0 ? 'past' : (d <= 7 ? 'soon' : '');
    const word = d < 0 ? 'Deadline gone'
               : d === 0 ? 'Today'
               : d === 1 ? '1 day left'
               : `${d} days left`;
    badge = `<span class="ebadge ${cls}">${word}</span>`;
  }

  const facts = [];
  if(v.starts_at)  facts.push(fmtDay(v.starts_at));
  if(v.location)   facts.push(esc(String(v.location).slice(0,70)));
  if(v.is_virtual) facts.push('Virtual');
  if(v.cost_text)  facts.push(esc(String(v.cost_text).slice(0,60)));

  const done = v.decision !== 'undecided';

  return `<article class="inv ${v.decision} ${busy?'busy':''}">
    <div class="inv-head">
      <div>
        <h4>${esc(v.event_name || v.subject || 'Untitled')}</h4>
        <div class="inv-org">${esc(v.org_name || v.from_name || v.from_email || '')}</div>
      </div>
      ${badge}
    </div>

    ${facts.length?`<div class="inv-facts">${facts.join(' &middot; ')}</div>`:''}
    ${v.summary?`<p class="inv-sum">${esc(v.summary)}</p>`:''}
    ${v.sponsorship_levels?`<div class="inv-lvl"><b>Sponsorship</b> ${
      esc(String(v.sponsorship_levels).slice(0,220))}</div>`:''}

    <div class="inv-foot">
      <div class="inv-acts">
        ${['going','passed','maybe'].map(k=>
          `<button class="btn small ${v.decision===k?'':'ghost'}"
            data-decide="${v.id}" data-val="${k}" ${busy?'disabled':''}>${
            k==='going'?'Going':k==='passed'?'Passed':'Maybe'}</button>`).join('')}
        ${done?`<button class="btn small ghost" data-decide="${v.id}"
          data-val="undecided" ${busy?'disabled':''}>Clear</button>`:''}
      </div>
      <div class="inv-links">
        ${v.registration_url?`<a class="chip" href="${esc(v.registration_url)}"
          target="_blank" rel="noopener">Register</a>`:''}
        ${v.web_link?`<a class="chip" href="${esc(v.web_link)}"
          target="_blank" rel="noopener">Email</a>`:''}
        <span class="inv-box" title="Which mailbox it arrived in">${esc(v.mailbox||'')}</span>
      </div>
    </div>
  </article>`;
}

function pageInvites(){
  if(!S.loaded.invites) return `<main class="page">${calSwitch()}${loading()}</main>`;

  const all = S.invites || [];
  const open = all.filter(v=>v.decision==='undecided' && !v.is_past);
  const sets = {
    open: open,
    going: all.filter(v=>v.decision==='going'),
    all: all.filter(v=>!v.is_past),

  const rows = sets[S.inviteFilter] || open;

  const tabs = [
    ['open','Waiting on you', sets.open.length],

    `<button class="fchip ${S.inviteFilter===k?'on':''}" data-ifilt="${k}">${
      label} <b>${n}</b></button>`).join('');

  if(!all.length){
    return `<main class="page">${calSwitch()}
      <div class="empty"><h2>Nothing yet</h2>

  return `<main class="page">
    ${calSwitch()}

    ${S.inviteErr?`<div class="warn">${esc(S.inviteErr)}</div>`:''}

      ? `<div class="inv-list">${rows.map(inviteRow).join('')}</div>`

  </main>`;
}

function evRow(e){
  const who = e.contact_name
    ? ` <em>with ${esc(e.contact_name)}${e.company_name?', '+esc(e.company_name):''}</em>`
    : (e.location ? ` <em>${esc(String(e.location).slice(0,60))}</em>` : '');
  return `<div class="ev">
    <span class="t">${e.is_all_day?'All day':esc(fmtTime(e.starts_at))}</span>
    <span class="s">${esc(e.subject||'')}${who}</span>
    <span class="kind ${esc(e.event_type)}">${esc(KIND[e.event_type]||e.event_type)}</span>
  </div>`;
}

/* ================= pipeline and kpis ================= */
/* Pat's scorecard, mirroring the quarterly tracker he keeps by hand.
   The spreadsheet reports YTD against the annual target and nothing
   else, so 40 percent in April reads like failure when it is 160
   percent of pace. Both numbers appear here, and pace leads. */

function paceWord(p){
  if(p==null) return '';
  if(p >= 110) return 'ahead';
  if(p >= 90)  return 'on pace';
  return 'behind';
}
function paceColor(p){
  if(p==null) return 'var(--slate)';
  if(p >= 110) return 'var(--green)';
  if(p >= 90)  return 'var(--ink)';
  return 'var(--red)';
}
function kpiVal(row){
  return row.unit==='currency' ? money(row.ytd_actual) : num(row.ytd_actual);
}
function kpiTarget(row){
  return row.unit==='currency' ? money(row.year_target) : num(row.year_target);
}

function pageKpis(){
  if(!S.loaded.kpis) return loading();
  const k = S.kpi, m = S.metrics;
  const o = k.outcomes || {}, op = k.open || {};
  const qtr = Math.floor(new Date().getMonth()/3) + 1;
  if(S.kpiView === 'board') return pageBoard();

  /* ---- scorecard ---- */
  const score = k.score.map(r=>{
    const pct = r.pct_of_year!=null ? Math.min(100, Number(r.pct_of_year)) : 0;
    return `<tr>
      <td><b>${esc(r.label)}</b>${r.source==='manual'?' <span class="chip">entered by hand</span>':''}
        ${r.mapped?'':' <span class="chip bad">not mapped</span>'}</td>
      <td class="num">${esc(kpiTarget(r))}</td>
      <td class="num"><b>${esc(kpiVal(r))}</b></td>
      <td class="num" style="color:${paceColor(r.pct_of_pace)}">
        ${r.pct_of_pace!=null?r.pct_of_pace+'%':'&ndash;'}
        <small style="display:block;font-family:var(--body);font-size:10.5px">${paceWord(r.pct_of_pace)}</small></td>
      <td><span class="bar"><i style="width:${pct}%"></i></span>
        <small class="mono" style="color:var(--slate)">${r.pct_of_year!=null?r.pct_of_year+'% of year':''}</small></td>
    </tr>`;
  }).join('');

  /* ---- quarters ---- */
  const qPeak = Math.max(1, ...k.quarters.map(q=>Number(q.added)||0), Number(k.quarters[0]?.goal)||0);
  const quarters = k.quarters.map(q=>`<tr>
    <td>Q${q.quarter}${q.quarter===qtr?' <span class="chip hot">now</span>':''}</td>
    <td class="num">${money(q.goal)}</td>

async function moveDeal(stageId, status){
  if(S.dealBusy) return;
  S.dealBusy=true; S.dealErr='';
  S.kpiNote = status ? 'Marking ' + status + ' in Pipedrive\u2026' : 'Moving in Pipedrive\u2026';
  render();
  try{
    const body = { pipedrive_deal_id: Number(S.dealId) };
    if(stageId) body.stage_id = Number(stageId);
    if(status)  body.status = status;
    const res = await fetch(MOVE_URL, { method:'POST',
      headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
    const out = await res.json().catch(()=>({}));
    if(!res.ok || out.ok===false) throw new Error(out.message || out.error || 'Pipedrive returned ' + res.status);
    S.kpiNote = status
      ? `${out.title||'Deal'} marked ${status}.`
      : `${out.title||'Deal'} moved to ${out.stage_name||'the new stage'}.`;
    S.dealId=null;
    S.loaded.kpis=false; await loadKpis();
  }catch(err){ S.dealErr = err.message||String(err); }
  finally{ S.dealBusy=false; render(); }
}

async function createDeal(){
  if(S.dealBusy) return;
  const f = S.addForm || {};
  if(!String(f.title||'').trim()){ S.dealErr='A deal needs a title.'; return render(); }
  if(!f.stage_id){ S.dealErr='Pick a stage.'; return render(); }
  S.dealBusy=true; S.dealErr=''; S.kpiNote=''; render();
  try{
    const res = await fetch(ADDDEAL_URL, { method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({
        title: String(f.title).trim(),
        stage_id: Number(f.stage_id),
        value: f.value || null,
        org_id: f.org_id || null,
        user_id: f.user_id || null
      }) });
    const out = await res.json().catch(()=>({}));
    if(!res.ok || out.ok===false) throw new Error(out.message || out.error || 'Pipedrive returned ' + res.status);
    S.kpiNote = `${out.title||'Deal'} created in ${out.stage_name||'the pipeline'}.`;
    S.addOpen=false; S.addForm={}; S.orgHits=[];
    S.loaded.kpis=false; await loadKpis();
  }catch(err){ S.dealErr = err.message||String(err); }
  finally{ S.dealBusy=false; render(); }
}

let dragDealId = null;

function wireDrag(){
  document.querySelectorAll('[data-deal]').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      dragDealId = el.dataset.deal;
      el.classList.add('dragging');
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = 'move';
        // Firefox refuses to start a drag unless something is set.
        e.dataTransfer.setData('text/plain', dragDealId);
      }
    });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); dragDealId = null; });
  });

  document.querySelectorAll('[data-drop]').forEach(col=>{
    col.addEventListener('dragover', e=>{
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      col.classList.add('over');
    });
    // dragleave fires when crossing onto a child, so only clear the
    // highlight when the pointer has actually left the column.
    col.addEventListener('dragleave', e=>{
      if(!col.contains(e.relatedTarget)) col.classList.remove('over');
    });
    col.addEventListener('drop', e=>{
      e.preventDefault();
      col.classList.remove('over');
      const id = dragDealId || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
      const stage = col.dataset.drop;
      if(!id || !stage) return;
      const card = document.querySelector('[data-deal="'+id+'"]');
      // Dropping a card back where it started is not a change, and
      // sending it would write a pointless update to Pipedrive.
      if(card && String(card.dataset.stage) === String(stage)) return;
      S.dealId = id;
      moveDeal(stage, null);
    });
  });
}

  document.querySelectorAll('[data-deal]').forEach(el=>
    el.addEventListener('click',()=>{ S.dealId = el.dataset.deal; S.dealErr=''; render(); }));

  const dc = document.querySelector('[data-dclose]');

  const dm = document.getElementById('dMove');

async function saveKpiTargets(){
  if(S.kpiBusy) return;
  S.kpiBusy=true; S.kpiErr=''; render();
  try{
    const tgts = [...document.querySelectorAll('[data-tgt]')].map(el=>({
      metric_key: el.dataset.tgt,
      quarter_target: Number(String(el.value).replace(/[^0-9.\-]/g,'')) || 0
    }));
    for(const t of tgts){
      const { error } = await sb.from('kpi_targets')
        .update({ quarter_target: t.quarter_target, updated_at: new Date().toISOString() })
        .eq('metric_key', t.metric_key);
      if(error) throw error;
    }
    const mans = [...document.querySelectorAll('[data-man]')].map(el=>({
      quarter: Number(el.dataset.man),
      value: Number(String(el.value).replace(/[^0-9.\-]/g,'')) || 0
    }));
    for(const mv of mans){
      const { error } = await sb.from('kpi_manual')
        .update({ value: mv.value, updated_at: new Date().toISOString() })
        .eq('metric_key','competitive_bid').eq('year', S.kpi.year).eq('quarter', mv.quarter);
      if(error) throw error;
    }
    S.kpiEdit=false;
    S.kpiNote='Targets saved.';
    S.loaded.kpis=false;
    await loadKpis();
  }catch(err){ S.kpiErr = err.message||String(err); }
  finally{ S.kpiBusy=false; render(); }
}

function clsVisible(){
  let rows = S.cls || [];

  if(S.clsFilter !== 'all') rows = rows.filter(x => x.outcome === S.clsFilter);

  const dir = S.clsDir === 'asc' ? 1 : -1;
  const key = S.clsSort;
  rows = rows.slice().sort((a,b)=>{
    if(key === 'company_name'){
      return String(a.company_name||'').localeCompare(String(b.company_name||'')) * dir;
    }
    const av = Number(a[key]||0), bv = Number(b[key]||0);
    // Contacts descending breaks ties, since that is what the whole
    // ordering is for: read the expensive ones first.
    if(av === bv) return Number(b.contacts||0) - Number(a.contacts||0);
    return (av - bv) * dir;
  });

  return rows;
}

async function applyClassifications(dismiss){
  const ids = clsVisible().filter(x => S.clsPicked.has(x.company_id)).map(x => x.company_id);
  if(!ids.length) return;

  const affected = clsVisible().filter(x => S.clsPicked.has(x.company_id))
    .reduce((a,x) => a + Number(x.contacts||0), 0);
  if(!dismiss && !confirm(`Apply ${ids.length} classifications?\n\nThis changes ${affected} contacts. Anything marked not a fit stops receiving outreach.`)) return;

  S.clsBusy = true; S.clsErr = ''; S.clsNote = ''; render();
  try{
    if(dismiss){
      const { data, error } = await sb.rpc('dismiss_classifications', { p_ids: ids });
      if(error) throw error;
      S.clsNote = `${data} dismissed. No contacts were changed.`;
    } else {
      const { data, error } = await sb.rpc('apply_classifications', { p_ids: ids });
      if(error) throw error;
      const r = Array.isArray(data) ? data[0] : data;
      // Skipped contacts are the ones whose email says they work
      // somewhere else. Worth naming rather than burying, since that
      // is the number that says how messy the company records are.
      S.clsNote = `${r.companies_applied} companies applied, ${r.contacts_changed} contacts changed.`
        + (r.contacts_skipped ? ` ${r.contacts_skipped} left alone, on a different email domain from their company.` : '');
    }
    S.loaded.cls = false; S.loaded.leads = false;
    await loadClassifications(); await loadBatches(); await loadLeadRows();
  }catch(err){ S.clsErr = err.message || String(err); }
  finally{ S.clsBusy = false; render(); }
}

function clsRepaint(){

  const table = document.getElementById('clsTable');
  const empty = document.getElementById('clsEmpty');
  if(body) body.innerHTML = vis.map(clsRow).join('');
  if(table) table.style.display = vis.length ? '' : 'none';
  if(empty) empty.style.display = vis.length ? 'none' : '';

  // The message has to change with the reason, or a search that found
  // nothing reads as a database that is empty.
  const eh = document.getElementById('clsEmptyH');
  const ep = document.getElementById('clsEmptyP');
  if(eh) eh.textContent = S.clsSearch ? 'Nothing matches' : 'Nothing to review';
  if(ep) ep.textContent = S.clsSearch
    ? 'No company matches that search in this filter. Try a shorter word, or switch the filter to All.'
    : 'Run the Company Classifier in n8n to populate this.';

  const picked = vis.filter(x => S.clsPicked.has(x.company_id)).length;
  const c = document.querySelector('.actionbar .count b');
  if(c) c.textContent = String(picked);
  ['clsApply','clsDismiss'].forEach(id=>{
    const b = document.getElementById(id);
    if(b) b.disabled = !picked;
  });
  // Checkboxes were just rebuilt, so their handlers went with them.
  document.querySelectorAll('[data-cpick]').forEach(el=>
    el.addEventListener('change', onClsPick));
}

function onClsPick(e){
  const el = e.target;
  const id = el.dataset.cpick;
  if(el.checked) S.clsPicked.add(id); else S.clsPicked.delete(id);
  const row = el.closest('tr');
  if(row) row.classList.toggle('picked', el.checked);
  const vis = clsVisible();
  const picked = vis.filter(x => S.clsPicked.has(x.company_id)).length;
  const c = document.querySelector('.actionbar .count b');
  if(c) c.textContent = String(picked);
  ['clsApply','clsDismiss'].forEach(bid=>{
    const b = document.getElementById(bid);
    if(b) b.disabled = !picked;
  });
}

function wireClassify(){
  document.querySelectorAll('[data-lview]').forEach(el=>
    el.addEventListener('click',()=>{ S.leadView = el.dataset.lview; S.clsNote=''; S.clsErr=''; render(); }));
  document.querySelectorAll('[data-cfilter]').forEach(el=>
    el.addEventListener('click', async ()=>{
      S.clsFilter = el.dataset.cfilter;
      S.clsPicked = new Set();
      await loadClassifications();
      render();
    }));
  document.querySelectorAll('[data-cpick]').forEach(el=>
    el.addEventListener('change', onClsPick));

  // Typing repaints the rows rather than the page, so the cursor and
  // the selection stay where they were.
  const cs = document.getElementById('clsSearch');
  if(cs) cs.addEventListener('input',()=>{
    S.clsSearch = cs.value;
    clearTimeout(clsTimer);
    clsTimer = setTimeout(async ()=>{
      await loadClassifications();
      render();
      // Rendering rebuilt the input, so the cursor goes back to where
      // it was rather than to the start of the box.
      const el = document.getElementById('clsSearch');
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 400);
  });

  document.querySelectorAll('[data-csort]').forEach(el=>
    el.addEventListener('click',()=>{
      const k = el.dataset.csort;
      if(S.clsSort === k){
        S.clsDir = S.clsDir === 'asc' ? 'desc' : 'asc';
      } else {
        S.clsSort = k;
        // Names read best A to Z, numbers best highest first.
        S.clsDir = k === 'company_name' ? 'asc' : 'desc';
      }
      render();
    }));
  // The tail of the list: few contacts and high confidence. Being
  // wrong about one of these costs one contact, which is the whole
  // reason the list is ordered the way it is.
  const csafe = document.getElementById('clsSafe');
  if(csafe) csafe.addEventListener('click',()=>{
    clsVisible().forEach(x=>{
      if(x.outcome !== 'unsure' && Number(x.contacts) <= 2 && Number(x.confidence) >= 90){
        S.clsPicked.add(x.company_id);
      }
    });
    render();
  });

  const ca = document.getElementById('clsAll');
  if(ca) ca.addEventListener('click',()=>{
    clsVisible().filter(x=>x.outcome!=='unsure').forEach(x=>S.clsPicked.add(x.company_id)); render(); });
  const cn = document.getElementById('clsNone');
  if(cn) cn.addEventListener('click',()=>{
    clsVisible().forEach(x=>S.clsPicked.delete(x.company_id)); render(); });
  const cap = document.getElementById('clsApply');
  if(cap) cap.addEventListener('click',()=>applyClassifications(false));
  const cd = document.getElementById('clsDismiss');
  if(cd) cd.addEventListener('click',()=>applyClassifications(true));
  const cr = document.getElementById('clsRefresh');
  if(cr) cr.addEventListener('click', async ()=>{
    S.clsNote=''; S.clsErr=''; S.loaded.cls=false; render();
    await loadClassifications(); render(); });
}

  const pct = total ? Math.round(100*seen/total) : 100;
  return `<button class="row ${S.batchId===b.id?'active':''}" data-batch="${esc(b.id)}">
    <span class="row-top">
      <span class="name">${esc(b.name||'Untitled batch')}</span>

    </span>

      unconf?` &middot; <span style="color:var(--red)">${unconf} unconfirmed</span>`:''}${
      b.status && b.status!=='ready' ? ` &middot; ${esc(b.status)}` : ''}</span>
    <span class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></span>
  </button>`;
}

function leadHtml(l){

  if(l.company_city||l.company_state)
    facts.push(['Location', [l.company_city,l.company_state].filter(Boolean).join(', ')]);
  if(l.territory)        facts.push(['Territory', l.territory]);

  const links = [];
  if(l.linkedin_url)    links.push(`<a class="chip" href="${esc(l.linkedin_url)}" target="_blank" rel="noopener">LinkedIn</a>`);
  if(l.company_website) links.push(`<a class="chip" href="${esc(l.company_website)}" target="_blank" rel="noopener">Website</a>`);

  const hasMore = l.company_description || l.bio || l.company_keywords || links.length;

  return `<article class="lead ${on?'keep':''} ${l.is_gold?'gold':''} ${(!l.is_gold && (!l.vertical || l.apollo_matched===false))?'flag':''}">
    <label class="pick">
      <input type="checkbox" data-pick="${esc(l.contact_id)}" ${on?'checked':''}
             aria-label="Keep ${esc(l.full_name)}" />
    </label>
    <div class="lbody">
      <div class="lhead">
        <div style="min-width:0">
          <h3>${esc(l.full_name||'Unnamed')}</h3>
          <div class="role">${esc(l.title||'No title')}${l.company_name?` at <b>${esc(l.company_name)}</b>`:''}</div>
        </div>
        <span class="fit" title="Outreach fit score">${l.fit!=null?esc(l.fit):'&ndash;'}</span>
      </div>

      <div class="chips">
        ${l.is_gold?`<span class="chip gold" title="Hand-picked by Pat from his client tracking list">Pat's Gold</span>`:''}
        ${l.relationship?`<span class="chip">${esc(l.relationship)}</span>`:''}
        ${l.vertical?`<span class="chip hot">${esc(l.vertical)}</span>`
                    :`<span class="chip bad">No sector</span>`}
        ${l.apollo_matched===false?`<span class="chip bad" title="Apollo has no record of this person. Everything here came from the Evaboot scrape alone.">Unconfirmed</span>`:''}
        ${l.apollo_matched!==false && l.company_matched===false?`<span class="chip">Company unmatched</span>`:''}
        ${l.email?`<span class="chip good">${esc(l.email)}</span>`
                 :`<span class="chip">No email</span>`}
        ${l.email_status?`<span class="chip">${esc(l.email_status)}</span>`:''}
        ${l.office_phone?`<span class="chip">${esc(l.office_phone)}</span>`:''}
      </div>

      ${facts.length?`<dl class="facts">${facts.map(([k,v])=>
        `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`:''}

      ${open?`<div class="more">
        ${l.company_description?`<p>${esc(l.company_description)}</p>`:''}
        ${l.company_keywords?`<p class="mono muted">${esc(l.company_keywords)}</p>`:''}
        ${l.bio?`<p class="hint">${esc(l.bio)}</p>`:''}
        ${links.length?`<div class="chips">${links.join('')}</div>`:''}
      </div>`:''}

      ${hasMore?`<button class="linkbtn" data-more="${esc(l.contact_id)}"
        style="padding-left:0">${open?'Less':'What Apollo found'}</button>`:''}
    </div>
  </article>`;
}

    const p = S.leadProg;
    const pct = p.total ? Math.round(100*p.done/p.total) : 0;

      <span class="count">${esc(p.verb)} ${p.done} of ${p.total}${p.failed?` &middot; ${p.failed} failed`:''}</span>
      <span class="prog"><i style="width:${pct}%"></i></span>
    </div>`;
  }
  return `<div class="actionbar">
    <span class="count"><b>${kept}</b> of ${total} kept</span>
    <div class="grp">
      <button class="btn small ghost" id="leadNone">Clear</button>
      <button class="btn small ghost" id="leadAll">Select all</button>
      <button class="btn small ghost" id="leadReject" ${kept?'':'disabled'}>Reject</button>
      <button class="btn small accent" id="leadApprove" ${kept?'':'disabled'}>Approve to Pipedrive</button>
    </div>
  </div>`;
}

               placeholder="Sacramento property managers, August" /></div>

      <div class="field"><label for="impVert">Sector</label>
        <select id="impVert">${opts}</select></div>
      <p class="hint">Anything the classifier cannot place from the company data falls back

      <div class="field"><label for="impFile">CSV file</label>

      ${S.impErr?`<p class="hint err">${esc(S.impErr)}</p>`:''}

      <div class="sheet-foot">

        <p class="hint" style="margin-top:8px">Every ten leads is one Apollo call, so a few
          hundred rows takes a couple of minutes. Leave the tab open.</p>
