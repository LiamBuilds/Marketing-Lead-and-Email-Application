function wireLeads(){
  wireClassify();
  document.querySelectorAll('[data-batch]').forEach(el=>
    el.addEventListener('click', async ()=>{
      S.batchId = el.dataset.batch; S.leadNote=''; S.leadErr='';
      S.loaded.leads = false; render();
      await loadLeadRows(); render();
    }));

  document.querySelectorAll('[data-lfilter]').forEach(el=>
    el.addEventListener('click',()=>{ S.leadFilter = el.dataset.lfilter; render(); }));

  document.querySelectorAll('[data-more]').forEach(el=>
    el.addEventListener('click',()=>{
      const id = el.dataset.more;
      S.leadOpen[id] = !S.leadOpen[id];
      render();
    }));

  /* Toggling a checkbox updates in place rather than re-rendering, so
     ticking through six hundred cards stays instant. */
  document.querySelectorAll('[data-pick]').forEach(el=>
    el.addEventListener('change',()=>{
      const id = el.dataset.pick;
      if(el.checked) S.picked.add(id); else S.picked.delete(id);
      const card = el.closest('.lead');
      if(card) card.classList.toggle('keep', el.checked);
      const vis = visibleLeads();
      const kept = vis.filter(l=>S.picked.has(l.contact_id)).length;
      const c = document.querySelector('.actionbar .count b');
      if(c) c.textContent = String(kept);
      ['leadApprove','leadReject'].forEach(bid=>{
        const b = document.getElementById(bid);
        if(b) b.disabled = !kept;
      });
    }));

  const rf = document.getElementById('leadRefresh');
  if(rf) rf.addEventListener('click', async ()=>{
    S.leadNote=''; S.leadErr=''; S.loaded.leads=false; render();
    await loadBatches(); await loadLeadRows(); render();
  });

  const selAll = document.getElementById('leadAll');
  if(selAll) selAll.addEventListener('click',()=>{
    visibleLeads().forEach(l=>S.picked.add(l.contact_id)); render(); });

  const selNone = document.getElementById('leadNone');
  if(selNone) selNone.addEventListener('click',()=>{
    visibleLeads().forEach(l=>S.picked.delete(l.contact_id)); render(); });

  const ap = document.getElementById('leadApprove');
  if(ap) ap.addEventListener('click', approveLeads);

  const rj = document.getElementById('leadReject');
  if(rj) rj.addEventListener('click', rejectLeads);

  ['impOpen','impOpen2'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('click',()=>{ S.impOpen=true; S.impErr=''; render(); });
  });

  const ic = document.getElementById('impClose');
  if(ic) ic.addEventListener('click',()=>{ S.impOpen=false; render(); });

  const iv = document.getElementById('impVert');
  if(iv) iv.addEventListener('change',()=>{ S.impVert = iv.value; });

  const inm = document.getElementById('impName');
  if(inm) inm.addEventListener('input',()=>{ S.impName = inm.value; });

  const ifl = document.getElementById('impFile');
  if(ifl) ifl.addEventListener('change',()=>readCsvFile(ifl));

  const ir = document.getElementById('impRun');
  if(ir) ir.addEventListener('click', runImport);
}

/* ---------- CSV ---------- */
/* Evaboot profile summaries carry commas, quotes and line breaks, so
   splitting on commas mangles roughly one row in three. This is a real
   RFC 4180 reader: quoted fields, doubled quotes, embedded newlines. */
function parseDelimited(text, delim){
  const rows=[]; let row=[], field='', i=0, inQ=false;
  while(i < text.length){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){
        if(text[i+1] === '"'){ field+='"'; i+=2; continue; }
        inQ=false; i++; continue;
      }
      field+=ch; i++; continue;
    }
    if(ch === '"'){ inQ=true; i++; continue; }
    if(ch === delim){ row.push(field); field=''; i++; continue; }
    if(ch === '\r'){ i++; continue; }
    if(ch === '\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=ch; i++;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function sniffDelimiter(text){
  const line = text.split(/\r?\n/,1)[0] || '';
  const c=(line.match(/,/g)||[]).length, s=(line.match(/;/g)||[]).length, t=(line.match(/\t/g)||[]).length;
  if(t>c && t>s) return '\t';
  if(s>c) return ';';
  return ',';
}

/* Headers stay exactly as Evaboot wrote them. The import workflow reads
   "First Name", "Current Job", "Linkedin URL Public" and the rest by
   literal string, so renaming anything here silently empties the field. */
function csvToRows(text){
  const clean = text.replace(/^\uFEFF/,'');
  const rows = parseDelimited(clean, sniffDelimiter(clean))
    .filter(r=>r.some(c=>String(c).trim()!==''));
  if(rows.length < 2) return { rows:[], headers:[] };
  const headers = rows[0].map(h=>String(h).trim());
  const out = rows.slice(1).map(r=>{
    const o={}; headers.forEach((h,idx)=>{ if(h) o[h] = r[idx]==null ? '' : r[idx]; });
    return o;
  });
  return { rows: out, headers };
}

function readCsvFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  S.impFile = file.name; S.impErr='';
  if(!S.impName) S.impName = file.name.replace(/\.csv$/i,'');
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const { rows, headers } = csvToRows(String(reader.result||''));
      S.impRows = rows;
      if(!rows.length){
        S.impErr = 'No data rows found. Export from Evaboot as CSV rather than XLSX.';
      } else if(!headers.includes('First Name') && !headers.includes('Full Name')){
        S.impErr = 'This does not look like an Evaboot export. The importer needs the original column headers, so upload the file exactly as Evaboot produced it.';
      }
    }catch(err){
      S.impRows = null;
      S.impErr = 'That file could not be read. ' + (err.message||'');
    }
    render();
  };
  reader.onerror = ()=>{ S.impErr='That file could not be read.'; render(); };
  reader.readAsText(file);
}

/* ---------- lead actions ---------- */
async function postIds(url, ids){
  const res = await fetch(url,{method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({contact_ids:ids})});
  if(!res.ok) throw new Error('The request came back ' + res.status);
  return res.json().catch(()=>({}));
}

async function approveLeads(){
  const ids = visibleLeads().filter(l=>S.picked.has(l.contact_id)).map(l=>l.contact_id);
  if(!ids.length) return;
  S.leadErr=''; S.leadNote='';
  S.leadProg = { verb:'Approving', done:0, total:ids.length, failed:0 };
  render();

  let failed = 0;
  for(let i=0; i<ids.length; i+=APPROVE_CHUNK){
    const slice = ids.slice(i, i+APPROVE_CHUNK);
    try{ await postIds(APPROVE_URL, slice); }
    catch{ failed += slice.length; }
    S.leadProg.done = Math.min(i+slice.length, ids.length);
    S.leadProg.failed = failed;
    render();
  }

  const cleared = ids.length - failed;
  S.leadProg = null;
  S.leadNote = failed
    ? `${cleared} approved and pushed to Pipedrive. ${failed} did not go through, and they are still here to retry.`
    : `${cleared} approved and pushed to Pipedrive.`;
  S.loaded.leads=false; S.loaded.tiles=false; S.loaded.metrics=false;
  await loadBatches(); await loadLeadRows(); render();
}

async function rejectLeads(){
  const ids = visibleLeads().filter(l=>S.picked.has(l.contact_id)).map(l=>l.contact_id);
  if(!ids.length) return;
  S.leadErr=''; S.leadNote='';
  S.leadProg = { verb:'Rejecting', done:0, total:ids.length, failed:0 };
  render();
  try{
    /* One SQL update, so this does not need chunking. */
    const out = await postIds(REJECT_URL, ids);
    const n = out.rejected!=null ? out.rejected : ids.length;
    S.leadNote = `${n} rejected. The records stay in the database, so the same people turning up in a later scrape are recognised rather than reviewed twice.`;
  }catch(err){ S.leadErr = err.message||String(err); }
  S.leadProg = null;
  S.loaded.leads=false;
  await loadBatches(); await loadLeadRows(); render();
}

async function runImport(){
  if(!S.impRows || !S.impRows.length) return;
  S.impBusy=true; S.impErr=''; S.leadNote=''; render();

  let requestedBy = '';
  try{
    const { data } = await sb.auth.getUser();
    requestedBy = (data && data.user && data.user.email) || '';
  }catch{ /* not fatal */ }

  try{
    const res = await fetch(IMPORT_URL,{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({
        name: S.impName.trim() || S.impFile.replace(/\.csv$/i,'') || 'Evaboot import',
        vertical_slug: S.impVert,
        requested_by: requestedBy,
        leads: S.impRows
      })});
    const out = await res.json().catch(()=>({}));
    if(!res.ok || out.ok===false) throw new Error(out.error || 'The import came back ' + res.status);

    const bits = [`${out.inserted} new leads from ${S.impRows.length} rows`];
    if(out.matched!=null)    bits.push(`${out.matched} matched in Apollo`);
    if(out.new_companies)    bits.push(`${out.new_companies} new companies`);
    if(out.with_email!=null) bits.push(`${out.with_email} with an email`);
    if(out.skipped)          bits.push(`${out.skipped} skipped for failing your Sales Navigator filters`);
    if(out.no_vertical)      bits.push(`${out.no_vertical} with no sector`);
    S.leadNote = bits.join('. ') + '.';

    S.impOpen=false; S.impRows=null; S.impFile=''; S.impName='';
    if(out.batch_id) S.batchId = out.batch_id;
    S.loaded.leads=false;
    await loadBatches(); await loadLeadRows();
  }catch(err){
    S.impErr = (err.message||String(err)) +
      '. Large files take a while, since every ten leads is one Apollo call. If it timed out, check the batch list before uploading again so you do not import twice.';
  }finally{
    S.impBusy=false; render();
  }
}

/* ================= actions ================= */
async function useDraft(draftId){
  if(S.busy) return;
  const r = S.board.find(x=>x.queue_id===S.activeId);
  const d = (S.drafts[r.queue_id]||[]).find(x=>x.id===draftId);
  if(!r||!d) return;
  const subject = document.getElementById('s-'+draftId).value.trim();
  const bodyText = document.getElementById('b-'+draftId).value.trim();
  if(!subject||!bodyText){ S.err='Add a subject and a message before sending.'; return render(); }

  // This sends for real and cannot be recalled, so it asks first.
  if(!confirm('Send this to ' + (r.email||'this contact') + ' now?\n\nIt goes out from Pat\u2019s mailbox immediately and cannot be recalled.')) return;

  S.busy=true; S.err=''; render();
  try{
    // The generated body already opens with a greeting and closes with
    // Pat, and the generator picks the greeting name properly: it reads
    // the email local part to catch Pipedrive records with first and last
    // reversed. This page used to prepend its own naive version on top,
    // which is why every email went out saying "Hi Liam, Hi Liam". Take
    // the editor text as written and only reattach the signature.
    const sigStart = (d.body_html||'').indexOf('<table');
    const signature = sigStart>-1 ? d.body_html.slice(sigStart) : '';

    const { error:upErr } = await sb.from('email_drafts')
      .update({ edited_subject:subject, edited_body:toHtml(bodyText)+signature })
      .eq('id', draftId);
    if(upErr) throw upErr;

    const res = await fetch(ACTION_URL,{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({queue_id:r.queue_id, draft_id:draftId})});
    const out = await res.json().catch(()=>({}));
    if(!res.ok||!out.ok) throw new Error(out.error||'Could not create the draft. It may already have been handled.');

    await loadBoard();
    S.loaded.metrics=false; S.loaded.tiles=false;
  }catch(err){ S.err = err.message||String(err); }
  finally{ S.busy=false; render(); }
}

async function generate(verticalId, count, gold){
  if(S.busy) return;
  S.busy=true; S.gen='Pulling contacts and writing drafts, this takes about a minute…'; render();
  try{
    const body = gold ? {gold:true, count:count} : {vertical_id:verticalId, count:count};
    const res = await fetch(GENERATE_URL,{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify(body)});
    const out = await res.json().catch(()=>({}));
    S.gen = out.ok ? `Queued ${out.queued}. Open the Today tab to work through them.`
                   : (out.error || 'Nothing eligible in that sector right now.');
    S.loaded.board=false; S.loaded.tiles=false; S.loaded.metrics=false;
    await loadTiles(); await loadBoard();
  }catch(err){ S.gen = 'That did not go through: ' + (err.message||err); }
  finally{ S.busy=false; render(); }
}

async function generateAcross(){
  if(S.busy) return;
  const live = (S.tiles||[]).filter(t=>Number(t.pool)>0);
  if(!live.length){ S.gen='No sector has eligible contacts right now.'; return render(); }
  S.busy=true; S.gen=`Pulling two from each of ${live.length} sectors…`; render();
  let total = 0;
  try{
    for(const t of live){
      const res = await fetch(GENERATE_URL,{method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({vertical_id:t.vertical_id, count:2})});
      const out = await res.json().catch(()=>({}));
      if(out.ok) total += Number(out.queued||0);
    }
    S.gen = `Queued ${total} across ${live.length} sectors. Open the Today tab to work through them.`;
    S.loaded.board=false; S.loaded.tiles=false; S.loaded.metrics=false;
    await loadTiles(); await loadBoard();
  }catch(err){ S.gen = 'Stopped partway: ' + (err.message||err); }
  finally{ S.busy=false; render(); }
}

async function addTask(){
  const el = document.getElementById('taskTitle');
  const title = el.value.trim();
  if(!title){ el.focus(); return; }
  const category = document.getElementById('taskCat').value;
  const priority = Number(document.getElementById('taskPri').value);
  S.err='';
  try{
    const { error } = await sb.from('tasks').insert({
      title, category, priority, owner:'liam',
      work_date: today(), sort_order: (S.tasks||[]).length
    });
    if(error) throw error;
    await loadTasks(); render();
    const n = document.getElementById('taskTitle'); if(n) n.focus();
  }catch(err){ S.err = err.message||String(err); render(); }
}

async function cycleTask(id){
  const t = (S.tasks||[]).find(x=>x.id===id);
  if(!t) return;
  const next = t.status==='open' ? 'doing' : (t.status==='doing' ? 'done' : 'open');
  try{
    await sb.from('tasks').update({ status: next }).eq('id', id);
    await loadTasks(); render();
  }catch(err){ S.err = err.message||String(err); render(); }
}

async function delTask(id){
  try{
    await sb.from('tasks').delete().eq('id', id);
    await loadTasks(); render();
  }catch(err){ S.err = err.message||String(err); render(); }
}

function exportCsv(){
  const m = S.metrics; if(!m) return;
  const k = S.kpi;
  const rows = [];
  const push = (...cells) => rows.push(cells.map(c => {
    const s = String(c ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(','));

  push('HAGGERTY marketing summary', prettyDate());
  push('');
  if(k && k.score.length){
    push('Pat scorecard, ' + k.year);
    push('Metric','Quarter target','Year target','Year to date','% of year','% of pace');
    k.score.forEach(r=>push(r.label, r.quarter_target, r.year_target,
      r.ytd_actual, r.pct_of_year, r.pct_of_pace));
    push('');
    push('Pipeline added by quarter');
    push('Quarter','Goal','Added','Deals');
    k.quarters.forEach(q=>push('Q'+q.quarter, q.goal, q.added, q.deals));
    push('');
  }
  push('Headline');
  const h = m.head;
  push('Sent 30 days', h.sent_30d); push('Replies 30 days', h.replied_30d);
  push('Reply rate %', h.reply_rate_30d); push('Send-through %', h.send_through_30d);
  push('Bounced', h.bounced_30d); push('Open deals', h.open_deals);
  push('Open value', h.open_value); push('Engaged contacts', h.engaged_contacts);
  push('');
  push('Daily'); push('Day','Drafted','Sent','Replied','Bounced');
  m.daily.forEach(d=>push(d.day,d.drafted,d.sent,d.replied,d.bounced));
  push('');
  push('By sector'); push('Sector','Drafted','Sent','Replied','Reply rate %');
  m.vert.forEach(v=>push(v.vertical,v.drafted,v.sent,v.replied,v.reply_rate_pct));
  push('');
  push('By approach'); push('Approach','Chosen','Sent','Replied','Reply rate %');
  m.variant.forEach(v=>push(LABELS[v.variant_type]||v.variant_type,
    v.times_selected,v.times_sent,v.replied,v.reply_rate_pct));
  push('');
  push('Pipeline'); push('Stage','Deals','Value');
  m.pipe.forEach(p=>push(p.stage,p.deals,p.value));

  const blob = new Blob([rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'haggerty-marketing-' + today() + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= boot ================= */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return renderLogin();
  try{
    await ensure('today');
    render();
  }catch(e){
    app.innerHTML = topbar() + `<div class="empty"><h2>Could not load</h2>
      <p>${esc(e.message||e)}</p>
      <p class="hint" style="margin-top:12px">If this mentions permissions, your account may not have access yet.</p></div>`;
    wireChrome();
  }
}
boot();
