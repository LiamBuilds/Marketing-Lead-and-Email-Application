<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HAGGERTY Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B1A; --paper:#FAF9F7; --card:#FFFFFF;
    --rule:#DFDBD4; --rule-soft:#EDEAE5;
    --grey:#4D4D4D; --slate:#6E7477;
    --orange:#F68922; --orange-tint:#FEF3E7;
    --green:#3F7D5C; --red:#A6402C;
    --display:"Barlow Condensed",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}

  .eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
           font-weight:600;font-size:13px;color:var(--slate)}
  .mono{font-family:var(--mono);font-size:12px}

  /* ---------- shell ---------- */
  .topbar{display:flex;align-items:center;gap:18px;padding:14px 24px;
          border-bottom:1px solid var(--rule);background:var(--card);
          position:sticky;top:0;z-index:20}
  .wordmark{font-family:var(--display);font-weight:700;font-size:22px;
            letter-spacing:.14em;text-transform:uppercase}
  .wordmark span{color:var(--orange)}
  .tabs{display:flex;gap:2px;margin-left:8px}
  .tab{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;
       font-weight:600;font-size:14px;color:var(--slate);
       background:none;border:0;border-bottom:2px solid transparent;
       padding:6px 12px 5px;cursor:pointer}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--orange)}
  .spacer{flex:1}
  .tally{font-family:var(--mono);font-size:12px;color:var(--slate)}
  .tally b{color:var(--ink);font-weight:500}
  .linkbtn{background:none;border:none;color:var(--slate);font-size:13px;
           cursor:pointer;padding:4px 6px;text-decoration:underline}
  .linkbtn:hover{color:var(--ink)}

  /* ---------- board ---------- */
  .layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 55px)}
  .board{border-right:1px solid var(--rule);background:var(--card)}
  .board-head{padding:14px 18px 10px;border-bottom:1px solid var(--rule-soft)}
  .row{display:block;width:100%;text-align:left;background:none;border:0;
       border-bottom:1px solid var(--rule-soft);padding:13px 18px 13px 16px;
       cursor:pointer;border-left:3px solid transparent}
  .row:hover{background:#FBFAF8}
  .row.active{background:var(--orange-tint);border-left-color:var(--orange)}
  .row.done .name{color:var(--slate)}
  .row-top{display:flex;align-items:baseline;gap:8px}
  .idx{font-family:var(--mono);font-size:11px;color:var(--slate);min-width:18px}
  .name{font-weight:600;font-size:14px}
  .org{font-size:12.5px;color:var(--slate);margin-left:26px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tick{margin-left:auto;color:var(--green);font-size:13px}

  .detail{padding:26px 30px 80px;max-width:840px}
  .who h1{font-family:var(--display);font-size:34px;font-weight:700;
          margin:0 0 2px;line-height:1.1}
  .who .role{color:var(--grey);font-size:15px}
  .who .org-line{margin-top:2px;font-size:14px;color:var(--slate)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
  .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);
        padding:3px 7px;color:var(--slate);background:var(--card);
        text-decoration:none}
  .chip.hot{border-color:var(--orange);color:#8A4A05;background:var(--orange-tint)}
  .context{margin:20px 0 26px;padding:14px 16px;background:var(--card);
           border:1px solid var(--rule)}
  .context p{margin:6px 0 0;font-size:13.5px;color:var(--grey)}
  .context .none{color:var(--slate);font-style:italic}
  .options-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;
                padding-bottom:8px;border-bottom:2px solid var(--ink)}

  .opt{background:var(--card);border:1px solid var(--rule);
       border-left:3px solid var(--rule);margin-bottom:10px}
  .opt.open{border-left-color:var(--grey)}
  .opt-head{display:flex;align-items:center;gap:10px;width:100%;background:none;
            border:0;padding:12px 14px;cursor:pointer;text-align:left}
  .opt-n{font-family:var(--mono);font-size:11px;color:var(--slate)}
  .opt-label{font-family:var(--display);text-transform:uppercase;
             letter-spacing:.08em;font-weight:600;font-size:13px}
  .opt-subject{flex:1;font-size:13px;color:var(--slate);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt-body{padding:0 14px 14px;border-top:1px solid var(--rule-soft)}
  .field{margin-top:12px}
  .field label{display:block;font-family:var(--display);text-transform:uppercase;
               letter-spacing:.08em;font-size:12px;color:var(--slate);
               font-weight:600;margin-bottom:4px}
  input[type=text],input[type=password],textarea{
    width:100%;font-family:var(--body);font-size:14px;line-height:1.6;
    color:var(--ink);background:var(--paper);border:1px solid var(--rule);
    border-radius:0;padding:9px 11px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:-1px}
  textarea{min-height:190px}
  .opt-actions{display:flex;align-items:center;gap:12px;margin-top:14px}
  .btn{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
       font-weight:600;font-size:14px;background:var(--ink);color:#fff;border:0;
       padding:10px 20px;cursor:pointer}
  .btn:hover{background:#000}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .hint{font-size:12.5px;color:var(--slate)}
  .hint.err{color:var(--red)}
  .done-banner{background:var(--card);border:1px solid var(--rule);
               border-left:3px solid var(--green);padding:16px 18px;margin-bottom:18px}
  .done-banner .eyebrow{color:var(--green)}
  .done-banner p{margin:6px 0 0;font-size:14px;color:var(--grey)}

  /* ---------- overview ---------- */
  .over{padding:26px 30px 80px;max-width:1180px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
             gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:30px}
  .stat{background:var(--card);padding:16px 18px}
  .stat .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
           font-size:12px;color:var(--slate);font-weight:600}
  .stat .v{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.15;
           margin-top:2px}
  .stat .v small{font-size:16px;color:var(--slate);font-weight:600}
  .stat.accent .v{color:var(--orange)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  @media (max-width:900px){.cols{grid-template-columns:1fr}}
  .block{margin-bottom:30px}
  .block h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
            font-size:15px;font-weight:700;margin:0 0 10px;
            padding-bottom:7px;border-bottom:2px solid var(--ink)}
  table{width:100%;border-collapse:collapse;background:var(--card);
        border:1px solid var(--rule)}
  th{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
     font-size:11.5px;color:var(--slate);font-weight:600;text-align:left;
     padding:8px 12px;border-bottom:1px solid var(--rule)}
  td{padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--rule-soft)}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-family:var(--mono);font-size:12.5px}
  .bar{height:6px;background:var(--rule-soft);position:relative;min-width:60px}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--orange);display:block}
  .state{font-family:var(--mono);font-size:11px;padding:2px 6px;border:1px solid var(--rule)}
  .state.replied{color:var(--green);border-color:var(--green)}
  .state.bounced{color:var(--red);border-color:var(--red)}
  .muted{color:var(--slate)}

  /* ---------- states ---------- */
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .panel{width:100%;max-width:360px;background:var(--card);
         border:1px solid var(--rule);padding:30px 28px}
  .panel .wordmark{font-size:26px;display:block;margin-bottom:4px}
  .panel .eyebrow{margin-bottom:22px;display:block}
  .panel .btn{width:100%;margin-top:20px}
  .empty{padding:60px 30px;max-width:560px}
  .empty h2{font-family:var(--display);font-size:26px;margin:0 0 6px;font-weight:700}
  .empty p{color:var(--grey);font-size:14.5px;margin:0 0 4px}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    .board{border-right:0;border-bottom:1px solid var(--rule)}
    .detail,.over{padding:20px 18px 60px}
  }
  @media (prefers-reduced-motion:no-preference){
    .row{transition:background .12s ease}
    .opt{transition:border-left-color .18s ease}
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ekatzukprjpisdiwubjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bdyRB7Mx0BKzNj1EcYlRCg_8JLDXEIL';
const ACTION_URL   = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-outreach-action';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');

const LABELS = {
  direct_bid:'Direct bid request', routing_question:'Who handles GC selection',
  project_anchor:'Anchored to past work', local_proximity:'Local angle',
  plain_intro:'Introduction only'
};

const S = { tab:'board', board:[], drafts:{}, activeId:null, open:{},
            busy:false, err:'', metrics:null };

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = n => (n===null||n===undefined) ? '0' : Number(n).toLocaleString('en-US');
const money = n => '$' + Math.round(Number(n||0)).toLocaleString('en-US');
const today = () => { const d=new Date();
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'); };
const prettyDate = () => new Date().toLocaleDateString('en-US',
  {weekday:'long',month:'long',day:'numeric'});

function toPlain(html){
  if(!html) return '';
  let s = String(html);
  const cut = s.indexOf('<table');
  if(cut>-1) s = s.slice(0,cut);
  return s.replace(/<\/p>/gi,'\n\n').replace(/<br\s*\/?>/gi,'\n')
    .replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/\n{3,}/g,'\n\n').trim();
}
function toHtml(plain){
  return String(plain||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)
    .map(p=>'<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 14px 0;">'
      + esc(p).replace(/\n/g,'<br>') + '</p>').join('');
}

/* ---------------- auth ---------------- */
function renderLogin(msg){
  app.innerHTML = `<div class="center"><form class="panel" id="lf">
    <span class="wordmark">HAGGERT<span>Y</span></span>
    <span class="eyebrow">Outreach board</span>
    <div class="field"><label for="em">Email</label><input type="text" id="em" autocomplete="username"/></div>
    <div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password"/></div>
    ${msg?`<p class="hint err" style="margin-top:14px">${esc(msg)}</p>`:''}
    <button class="btn" type="submit">Sign in</button></form></div>`;
  document.getElementById('lf').addEventListener('submit', async e=>{
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({
      email:document.getElementById('em').value.trim(),
      password:document.getElementById('pw').value });
    if(error) return renderLogin(error.message);
    boot();
  });
}

/* ---------------- data ---------------- */
async function loadBoard(){
  const { data, error } = await sb.from('v_today_board').select('*')
    .eq('queue_date', today()).order('vertical_order').order('slot');
  if(error) throw error;
  S.board = data || [];
  S.drafts = {};
  if(S.board.length){
    const { data:d, error:e2 } = await sb.from('email_drafts').select('*')
      .in('queue_id', S.board.map(r=>r.queue_id)).order('variant_number');
    if(e2) throw e2;
    for(const x of (d||[])) (S.drafts[x.queue_id] ||= []).push(x);
  }
  if(!S.activeId || !S.board.some(r=>r.queue_id===S.activeId)){
    const next = S.board.find(r=>!r.handled) || S.board[0];
    S.activeId = next ? next.queue_id : null;
    S.open = {};
    const f = S.activeId && S.drafts[S.activeId]?.[0];
    if(f) S.open[f.id] = true;
  }
}

async function loadMetrics(){
  const [head, daily, vert, variant, pipe, cover, recent] = await Promise.all([
    sb.from('v_dash_headline').select('*').single(),
    sb.from('v_dash_daily').select('*'),
    sb.from('v_email_vertical_stats').select('*'),
    sb.from('v_variant_performance').select('*'),
    sb.from('v_dash_pipeline').select('*'),
    sb.from('v_vertical_coverage').select('*'),
    sb.from('v_dash_recent').select('*')
  ]);
  S.metrics = {
    head: head.data || {},
    daily: daily.data || [],
    vert: vert.data || [],
    variant: variant.data || [],
    pipe: pipe.data || [],
    cover: cover.data || [],
    recent: recent.data || []
  };
}

/* ---------------- chrome ---------------- */
function topbar(){
  const done = S.board.filter(r=>r.handled).length;
  return `<header class="topbar">
    <span class="wordmark">HAGGERT<span>Y</span></span>
    <nav class="tabs">
      <button class="tab ${S.tab==='board'?'on':''}" data-tab="board">Board</button>
      <button class="tab ${S.tab==='over'?'on':''}" data-tab="over">Overview</button>
    </nav>
    <span class="spacer"></span>
    <span class="tally">${esc(prettyDate())}</span>
    ${S.board.length?`<span class="tally"><b>${done}</b> / ${S.board.length} cleared</span>`:''}
    <button class="linkbtn" id="signout">Sign out</button>
  </header>`;
}
function wireChrome(){
  document.querySelectorAll('[data-tab]').forEach(el=>
    el.addEventListener('click', async ()=>{
      S.tab = el.dataset.tab;
      if(S.tab==='over' && !S.metrics){ await loadMetrics(); }
      render();
    }));
  const b = document.getElementById('signout');
  if(b) b.addEventListener('click', async ()=>{ await sb.auth.signOut(); renderLogin(); });
}

/* ---------------- render ---------------- */
function render(){
  app.innerHTML = topbar() + (S.tab==='board' ? boardView() : overView());
  wireChrome();
  if(S.tab==='board') wireBoard();
}

function boardView(){
  if(!S.board.length){
    return `<div class="empty"><h2>Nothing queued for today</h2>
      <p>The board fills at 6:15am on weekdays, after the overnight queue picks who to approach.</p>
      <p class="hint" style="margin-top:10px">Check the Overview tab for how the last month has gone.</p></div>`;
  }
  const done = S.board.filter(r=>r.handled).length;
  return `<div class="layout">
    <nav class="board">
      <div class="board-head"><span class="eyebrow">${done} of ${S.board.length} cleared</span></div>
      ${S.board.map(rowHtml).join('')}
    </nav>
    <main class="detail">${detailHtml()}</main></div>`;
}

function wireBoard(){
  document.querySelectorAll('[data-row]').forEach(el=>
    el.addEventListener('click',()=>{
      S.activeId = el.dataset.row; S.open = {}; S.err = '';
      const f = S.drafts[S.activeId]?.[0]; if(f) S.open[f.id]=true;
      render();
    }));
  document.querySelectorAll('[data-toggle]').forEach(el=>
    el.addEventListener('click',()=>{ const id=el.dataset.toggle;
      S.open[id]=!S.open[id]; render(); }));
  document.querySelectorAll('[data-use]').forEach(el=>
    el.addEventListener('click',()=>useDraft(el.dataset.use)));
}

function rowHtml(r,i){
  return `<button class="row ${r.queue_id===S.activeId?'active':''} ${r.handled?'done':''}" data-row="${r.queue_id}">
    <span class="row-top"><span class="idx">${String(i+1).padStart(2,'0')}</span>
    <span class="name">${esc(r.full_name||r.email)}</span>
    ${r.handled?'<span class="tick">&#10003;</span>':''}</span>
    <span class="org">${esc(r.company_name||r.vertical)}</span></button>`;
}

function detailHtml(){
  const r = S.board.find(x=>x.queue_id===S.activeId);
  if(!r) return '';
  const drafts = S.drafts[r.queue_id]||[];
  const chips = [
    r.vertical && `<span class="chip">${esc(r.vertical)}</span>`,
    r.territory && `<span class="chip">${esc(r.territory)}</span>`,
    r.company_city && `<span class="chip">${esc(r.company_city)}${r.company_state?', '+esc(r.company_state):''}</span>`,
    r.employee_count && `<span class="chip">${esc(r.employee_count)} staff</span>`,
    r.fit>=60 && `<span class="chip hot">Strong fit ${esc(r.fit)}</span>`,
    r.linkedin_url && `<a class="chip" href="${esc(r.linkedin_url)}" target="_blank" rel="noopener">LinkedIn</a>`,
    r.company_website && `<a class="chip" href="${esc(r.company_website)}" target="_blank" rel="noopener">Website</a>`
  ].filter(Boolean).join('');
  const ctx = r.company_description || r.company_keywords || r.company_industry;
  const head = `<div class="who"><h1>${esc(r.full_name||'Unknown contact')}</h1>
    <div class="role">${esc(r.title||'No title on file')}</div>
    <div class="org-line">${esc(r.company_name||'')} &middot; <span class="mono">${esc(r.email)}</span></div>
    <div class="chips">${chips}</div></div>
    <div class="context"><span class="eyebrow">What we know</span>
    ${ctx?`${r.company_industry?`<p><b>Industry</b> ${esc(r.company_industry)}</p>`:''}
      ${r.company_description?`<p>${esc(r.company_description)}</p>`:''}
      ${r.company_keywords?`<p class="mono muted">${esc(r.company_keywords)}</p>`:''}`
     :`<p class="none">No enrichment on file. The drafts below make no claims about this company.</p>`}
    </div>`;
  if(r.handled){
    return head + `<div class="done-banner"><span class="eyebrow">Cleared</span>
      <p>The draft is waiting in your Outlook drafts folder. Review it there and send when you are ready.</p>
      ${r.draft_web_link?`<p style="margin-top:10px"><a href="${esc(r.draft_web_link)}" target="_blank" rel="noopener"><b>Open the draft in Outlook</b></a></p>`:''}
      </div>`;
  }
  if(!drafts.length) return head + `<div class="context"><p class="none">No drafts generated for this contact yet.</p></div>`;
  return head + `<div class="options-head">
      <span class="eyebrow" style="color:var(--ink)">Five approaches</span>
      <span class="hint">Pick one, edit it, send it to your drafts</span></div>
    ${drafts.map(optHtml).join('')}
    ${S.err?`<p class="hint err">${esc(S.err)}</p>`:''}`;
}

function optHtml(d,i){
  const open = !!S.open[d.id];
  const subject = d.edited_subject || d.subject || '';
  return `<section class="opt ${open?'open':''}">
    <button class="opt-head" data-toggle="${d.id}">
      <span class="opt-n">${String(i+1).padStart(2,'0')}</span>
      <span class="opt-label">${esc(LABELS[d.variant_type]||d.variant_type)}</span>
      <span class="opt-subject">${esc(subject)}</span></button>
    ${open?`<div class="opt-body">
      <div class="field"><label for="s-${d.id}">Subject</label>
        <input type="text" id="s-${d.id}" value="${esc(subject)}"/></div>
      <div class="field"><label for="b-${d.id}">Message</label>
        <textarea id="b-${d.id}">${esc(toPlain(d.edited_body||d.body_html))}</textarea></div>
      <div class="opt-actions">
        <button class="btn" data-use="${d.id}" ${S.busy?'disabled':''}>
          ${S.busy?'Sending&hellip;':'Send to my drafts'}</button>
        <span class="hint">Greeting and signature are added automatically.</span>
      </div></div>`:''}
  </section>`;
}

/* ---------------- overview ---------------- */
function overView(){
  const m = S.metrics;
  if(!m) return `<div class="empty"><h2>Loading</h2></div>`;
  const h = m.head;

  const peak = Math.max(1, ...m.daily.map(d=>Number(d.drafted)||0));

  const stats = [
    ['Cleared today', `${num(h.cleared_today)}<small> / ${num(h.queued_today)}</small>`, false],
    ['Sent, 30 days', num(h.sent_30d), false],
    ['Replies, 30 days', num(h.replied_30d), true],
    ['Reply rate', h.reply_rate_30d!=null?`${h.reply_rate_30d}<small>%</small>`:'&ndash;', true],
    ['Send-through', h.send_through_30d!=null?`${h.send_through_30d}<small>%</small>`:'&ndash;', false],
    ['Bounced', num(h.bounced_30d), false],
    ['Open deals', num(h.open_deals), false],
    ['Open value', money(h.open_value), false],
    ['Engaged contacts', num(h.engaged_contacts), true],
    ['Pool remaining', num(h.pool_remaining), false]
  ].map(([k,v,a])=>`<div class="stat ${a?'accent':''}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  return `<main class="over">
    <div class="stat-grid">${stats}</div>

    <div class="cols">
      <div>
        <div class="block"><h2>Last 14 days</h2>
          <table><thead><tr><th>Day</th><th class="num">Drafted</th>
            <th class="num">Sent</th><th class="num">Replied</th><th style="width:34%"></th></tr></thead>
            <tbody>${m.daily.map(d=>`<tr>
              <td class="mono">${esc(String(d.day).slice(5))}</td>
              <td class="num">${num(d.drafted)}</td>
              <td class="num">${num(d.sent)}</td>
              <td class="num">${num(d.replied)}</td>
              <td><span class="bar"><i style="width:${Math.round(100*(Number(d.drafted)||0)/peak)}%"></i></span></td>
            </tr>`).join('')}</tbody></table>
        </div>

        <div class="block"><h2>Which approach works</h2>
          ${m.variant.length?`<table><thead><tr><th>Approach</th>
            <th class="num">Chosen</th><th class="num">Sent</th><th class="num">Replied</th>
            <th class="num">Rate</th></tr></thead><tbody>
            ${m.variant.map(v=>`<tr><td>${esc(LABELS[v.variant_type]||v.variant_type)}</td>
              <td class="num">${num(v.times_selected)}</td>
              <td class="num">${num(v.times_sent)}</td>
              <td class="num">${num(v.replied)}</td>
              <td class="num">${v.reply_rate_pct!=null?v.reply_rate_pct+'%':'&ndash;'}</td></tr>`).join('')}
            </tbody></table>`
          :`<p class="hint">Nothing sent yet. This fills in as Pat picks and sends, and it is the number that tells you which ask actually earns replies.</p>`}
        </div>
      </div>

      <div>
        <div class="block"><h2>Open pipeline</h2>
          ${m.pipe.length?`<table><thead><tr><th>Stage</th><th class="num">Deals</th>
            <th class="num">Value</th></tr></thead><tbody>
            ${m.pipe.map(p=>`<tr><td>${esc(p.stage)}</td>
              <td class="num">${num(p.deals)}</td>
              <td class="num">${money(p.value)}</td></tr>`).join('')}
            </tbody></table>`:`<p class="hint">No open deals in Pipedrive.</p>`}
        </div>

        <div class="block"><h2>Pool by sector</h2>
          <table><thead><tr><th>Sector</th><th class="num">Eligible</th>
            <th class="num">Out of area</th><th class="num">Undeliverable</th></tr></thead><tbody>
            ${m.cover.map(c=>`<tr><td>${esc(c.vertical)}</td>
              <td class="num">${num(c.eligible)}</td>
              <td class="num muted">${num(c.out_of_area)}</td>
              <td class="num muted">${num(c.undeliverable)}</td></tr>`).join('')}
          </tbody></table>
        </div>
      </div>
    </div>

    <div class="block"><h2>Recent outreach</h2>
      ${m.recent.length?`<table><thead><tr><th>Contact</th><th>Company</th>
        <th>Sector</th><th>Approach</th><th>State</th><th class="num">When</th></tr></thead><tbody>
        ${m.recent.map(r=>`<tr>
          <td>${esc(r.full_name||'')}</td>
          <td class="muted">${esc(r.company_name||'')}</td>
          <td class="muted">${esc(r.vertical||'')}</td>
          <td class="muted">${esc(LABELS[r.variant_type]||r.variant_type||'')}</td>
          <td><span class="state ${esc(r.state.replace(' ','-'))}">${esc(r.state)}</span></td>
          <td class="num muted">${esc(String(r.last_event_at||'').slice(5,16).replace('T',' '))}</td>
        </tr>`).join('')}</tbody></table>`
      :`<p class="hint">No outreach recorded yet.</p>`}
    </div>
  </main>`;
}

/* ---------------- action ---------------- */
async function useDraft(draftId){
  if(S.busy) return;
  const r = S.board.find(x=>x.queue_id===S.activeId);
  const d = (S.drafts[r.queue_id]||[]).find(x=>x.id===draftId);
  if(!r||!d) return;
  const subject = document.getElementById('s-'+draftId).value.trim();
  const bodyText = document.getElementById('b-'+draftId).value.trim();
  if(!subject||!bodyText){ S.err='Add a subject and a message before sending.'; return render(); }

  S.busy = true; S.err=''; render();
  try{
    const greeting = '<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 14px 0;">Hi '
      + esc(r.first_name || (r.full_name||'').split(' ')[0]) + ',</p>';
    const signoff = '<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 4px 0;">Pat</p>';
    const sigStart = (d.body_html||'').indexOf('<table');
    const signature = sigStart>-1 ? d.body_html.slice(sigStart) : '';

    const { error:upErr } = await sb.from('email_drafts')
      .update({ edited_subject:subject, edited_body:greeting+toHtml(bodyText)+signoff+signature })
      .eq('id', draftId);
    if(upErr) throw upErr;

    const res = await fetch(ACTION_URL,{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({queue_id:r.queue_id, draft_id:draftId})});
    const out = await res.json().catch(()=>({}));
    if(!res.ok||!out.ok) throw new Error(out.error||'The draft could not be created. Try again.');

    await loadBoard();
    S.metrics = null;
  }catch(err){ S.err = err.message||String(err); }
  finally{ S.busy=false; render(); }
}

/* ---------------- boot ---------------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return renderLogin();
  try{ await loadBoard(); render(); }
  catch(e){
    app.innerHTML = `<div class="empty"><h2>Could not load the board</h2>
      <p>${esc(e.message||e)}</p>
      <p class="hint" style="margin-top:12px">If this mentions permissions, your account may not have access yet.</p></div>`;
  }
}
boot();
</script>
