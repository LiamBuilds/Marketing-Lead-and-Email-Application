<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HAGGERTY Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B1A; --paper:#FAF9F7; --card:#FFFFFF;
    --rule:#DFDBD4; --rule-soft:#EDEAE5; --wash:#F6F4F1;
    --grey:#4D4D4D; --slate:#6E7477;
    --orange:#F68922; --orange-tint:#FEF3E7;
    --green:#3F7D5C; --red:#A6402C;
    --display:"Barlow Condensed",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  a{color:var(--grey)}

  .eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
           font-weight:600;font-size:13px;color:var(--slate)}
  .mono{font-family:var(--mono);font-size:12px}
  .muted{color:var(--slate)}
  .hint{font-size:12.5px;color:var(--slate)}
  .hint.err{color:var(--red)}

  /* ---------- chrome ---------- */
  .topbar{display:flex;align-items:center;gap:16px;padding:12px 22px;
          border-bottom:1px solid var(--rule);background:var(--card);
          position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .wordmark{font-family:var(--display);font-weight:700;font-size:21px;
            letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
  .wordmark span{color:var(--orange)}
  .tabs{display:flex;gap:1px;flex-wrap:wrap}
  .tab{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;
       font-weight:600;font-size:14px;color:var(--slate);
       background:none;border:0;border-bottom:2px solid transparent;
       padding:6px 11px 5px;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--orange)}
  .spacer{flex:1}
  .tally{font-family:var(--mono);font-size:12px;color:var(--slate);white-space:nowrap}
  .tally b{color:var(--ink);font-weight:500}
  .linkbtn{background:none;border:none;color:var(--slate);font-size:13px;
           cursor:pointer;padding:4px 6px;text-decoration:underline}
  .linkbtn:hover{color:var(--ink)}

  .page{padding:24px 26px 90px;max-width:1240px}
  .page.wide{max-width:none}
  h2.sec{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
         font-size:15px;font-weight:700;margin:0 0 10px;
         padding-bottom:7px;border-bottom:2px solid var(--ink)}
  .block{margin-bottom:28px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .cols3{display:grid;grid-template-columns:1.4fr 1fr;gap:26px}
  @media (max-width:960px){.cols,.cols3{grid-template-columns:1fr}}

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule)}
  th{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
     font-size:11.5px;color:var(--slate);font-weight:600;text-align:left;
     padding:8px 12px;border-bottom:1px solid var(--rule)}
  td{padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--rule-soft)}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-family:var(--mono);font-size:12.5px}
  .bar{height:6px;background:var(--rule-soft);position:relative;min-width:50px;display:block}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--orange)}

  /* ---------- stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
             gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:28px}
  .stat{background:var(--card);padding:15px 17px}
  .stat .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
           font-size:12px;color:var(--slate);font-weight:600}
  .stat .v{font-family:var(--display);font-size:31px;font-weight:700;line-height:1.15;margin-top:2px}
  .stat .v small{font-size:15px;color:var(--slate);font-weight:600}
  .stat.accent .v{color:var(--orange)}

  /* ---------- board ---------- */
  .split{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 54px)}
  .board{border-right:1px solid var(--rule);background:var(--card)}
  .board-head{padding:13px 17px 9px;border-bottom:1px solid var(--rule-soft)}
  .row{display:block;width:100%;text-align:left;background:none;border:0;
       border-bottom:1px solid var(--rule-soft);padding:12px 17px 12px 15px;
       cursor:pointer;border-left:3px solid transparent}
  .row:hover{background:#FBFAF8}
  .row.active{background:var(--orange-tint);border-left-color:var(--orange)}
  .row.done .name{color:var(--slate)}
  .row-top{display:flex;align-items:baseline;gap:8px}
  .idx{font-family:var(--mono);font-size:11px;color:var(--slate);min-width:18px}
  .name{font-weight:600;font-size:14px}
  .org{font-size:12.5px;color:var(--slate);margin-left:26px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tick{margin-left:auto;color:var(--green);font-size:13px}

  .who h1{font-family:var(--display);font-size:32px;font-weight:700;margin:0 0 2px;line-height:1.1}
  .who .role{color:var(--grey);font-size:15px}
  .who .org-line{margin-top:2px;font-size:14px;color:var(--slate)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0 0}
  .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);
        padding:3px 7px;color:var(--slate);background:var(--card);text-decoration:none}
  .chip.hot{border-color:var(--orange);color:#8A4A05;background:var(--orange-tint)}
  .panelbox{margin:18px 0 24px;padding:13px 15px;background:var(--card);border:1px solid var(--rule)}
  .panelbox p{margin:6px 0 0;font-size:13.5px;color:var(--grey)}
  .panelbox .none{color:var(--slate);font-style:italic}

  .opt{background:var(--card);border:1px solid var(--rule);
       border-left:3px solid var(--rule);margin-bottom:10px}
  .opt.open{border-left-color:var(--grey)}
  .opt-head{display:flex;align-items:center;gap:10px;width:100%;background:none;
            border:0;padding:11px 13px;cursor:pointer;text-align:left}
  .opt-n{font-family:var(--mono);font-size:11px;color:var(--slate)}
  .opt-label{font-family:var(--display);text-transform:uppercase;
             letter-spacing:.08em;font-weight:600;font-size:13px}
  .opt-subject{flex:1;font-size:13px;color:var(--slate);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt-body{padding:0 13px 13px;border-top:1px solid var(--rule-soft)}
  .field{margin-top:12px}
  .field label{display:block;font-family:var(--display);text-transform:uppercase;
               letter-spacing:.08em;font-size:12px;color:var(--slate);
               font-weight:600;margin-bottom:4px}
  input[type=text],input[type=password],textarea,select{
    width:100%;font-family:var(--body);font-size:14px;line-height:1.6;
    color:var(--ink);background:var(--paper);border:1px solid var(--rule);
    border-radius:0;padding:9px 11px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--orange);outline-offset:-1px}
  textarea{min-height:180px}
  .actions{display:flex;align-items:center;gap:12px;margin-top:13px;flex-wrap:wrap}
  .btn{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
       font-weight:600;font-size:14px;background:var(--ink);color:#fff;border:0;
       padding:9px 18px;cursor:pointer}
  .btn:hover{background:#000}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.small{font-size:12.5px;padding:6px 12px}
  .btn.ghost{background:none;color:var(--grey);border:1px solid var(--rule)}
  .btn.ghost:hover{background:var(--wash);color:var(--ink)}
  .done-banner{background:var(--card);border:1px solid var(--rule);
               border-left:3px solid var(--green);padding:15px 17px;margin-bottom:18px}
  .done-banner .eyebrow{color:var(--green)}
  .done-banner p{margin:6px 0 0;font-size:14px;color:var(--grey)}

  /* ---------- tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--rule);
        padding:14px 15px;display:flex;flex-direction:column;gap:2px}
  .tile.live{border-top-color:var(--orange)}
  .tile h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
           font-size:16px;font-weight:700;margin:0}
  .tile .pool{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
  .tile .pool small{font-size:13px;color:var(--slate);font-weight:600;letter-spacing:.04em}
  .tile .meta{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:2px}
  .tile .foot{margin-top:11px;display:flex;align-items:center;gap:8px}
  .tile.empty{opacity:.62}

  /* ---------- calendar ---------- */
  .day{border-top:1px solid var(--rule);background:var(--card)}
  .day:first-child{border-top:0}
  .day-head{display:flex;align-items:baseline;gap:10px;padding:9px 14px 7px;
            background:var(--wash);border-bottom:1px solid var(--rule-soft)}
  .day-head .d{font-family:var(--display);text-transform:uppercase;
               letter-spacing:.08em;font-weight:700;font-size:13px}
  .day-head .n{font-family:var(--mono);font-size:11px;color:var(--slate)}
  .day-head.today .d{color:var(--orange)}
  .ev{display:flex;align-items:baseline;gap:12px;padding:9px 14px;
      border-bottom:1px solid var(--rule-soft)}
  .ev:last-child{border-bottom:0}
  .ev .t{font-family:var(--mono);font-size:12px;color:var(--slate);min-width:62px;flex-shrink:0}
  .ev .s{flex:1;font-size:13.5px}
  .ev .s em{font-style:normal;color:var(--slate);font-size:12.5px}
  .kind{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
        letter-spacing:.05em;padding:2px 6px;border:1px solid var(--rule);
        color:var(--slate);flex-shrink:0}
  .kind.meeting{border-color:var(--orange);color:#8A4A05;background:var(--orange-tint)}
  .kind.networking{border-color:var(--green);color:var(--green)}
  .kind.site_visit{border-color:var(--ink);color:var(--ink)}
  .scroll{max-height:560px;overflow-y:auto;border:1px solid var(--rule)}
  .scroll.short{max-height:330px}

  /* ---------- tasks ---------- */
  .task{display:flex;align-items:flex-start;gap:11px;padding:10px 13px;
        background:var(--card);border:1px solid var(--rule);
        border-left:3px solid var(--rule);margin-bottom:7px}
  .task.doing{border-left-color:var(--orange);background:var(--orange-tint)}
  .task.done{border-left-color:var(--green);opacity:.6}
  .task.done .tt{text-decoration:line-through}
  .box{width:17px;height:17px;border:1.5px solid var(--slate);background:none;
       cursor:pointer;flex-shrink:0;margin-top:2px;padding:0;line-height:1}
  .task.done .box{background:var(--green);border-color:var(--green);color:#fff;font-size:11px}
  .task .mid{flex:1;min-width:0}
  .tt{font-size:14px}
  .tmeta{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:2px}
  .pri1{color:var(--red);font-weight:500}
  .taskbar{display:grid;grid-template-columns:1fr 130px 96px auto;gap:8px;
           margin-bottom:16px;align-items:end}
  @media (max-width:700px){.taskbar{grid-template-columns:1fr}}

  /* ---------- states ---------- */
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .loginbox{width:100%;max-width:360px;background:var(--card);
            border:1px solid var(--rule);padding:30px 28px}
  .loginbox .wordmark{font-size:26px;display:block;margin-bottom:4px}
  .loginbox .eyebrow{margin-bottom:22px;display:block}
  .loginbox .btn{width:100%;margin-top:20px}
  .empty{padding:52px 26px;max-width:560px}
  .empty h2{font-family:var(--display);font-size:25px;margin:0 0 6px;font-weight:700}
  .empty p{color:var(--grey);font-size:14.5px;margin:0 0 4px}

  @media (max-width:820px){
    .split{grid-template-columns:1fr}
    .board{border-right:0;border-bottom:1px solid var(--rule)}
    .page{padding:18px 16px 70px}
  }
  @media (prefers-reduced-motion:no-preference){
    .row,.task{transition:background .12s ease}
    .opt,.tile{transition:border-color .18s ease}
  }
  @media print{
    .topbar,.btn,.linkbtn{display:none !important}
    body{background:#fff}
    .page{max-width:none;padding:0}
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ekatzukprjpisdiwubjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bdyRB7Mx0BKzNj1EcYlRCg_8JLDXEIL';
const ACTION_URL   = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-outreach-action';
const GENERATE_URL = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-generate-vertical';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');

const LABELS = {
  direct_bid:'Direct bid request', routing_question:'Who handles GC selection',
  project_anchor:'Anchored to past work', local_proximity:'Local angle',
  plain_intro:'Introduction only'
};
const KIND = { meeting:'Meeting', networking:'Event', site_visit:'Site visit',
               internal:'Internal', other:'Block' };

const PAGES = [
  ['today','Today'], ['outreach','Outreach'], ['calendar','Calendar'],
  ['pipeline','Pipeline'], ['kpis','KPIs'], ['myday','My Day']
];

const S = {
  page:'today', board:[], drafts:{}, activeId:null, open:{},
  busy:false, err:'', gen:'', metrics:null, week:null, tiles:null,
  tasks:null, dayStatus:null, loaded:{}
};

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = n => (n===null||n===undefined) ? '0' : Number(n).toLocaleString('en-US');
const money = n => '$' + Math.round(Number(n||0)).toLocaleString('en-US');
const today = () => { const d=new Date();
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'); };
const prettyDate = () => new Date().toLocaleDateString('en-US',
  {weekday:'long',month:'long',day:'numeric'});
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-US',
  {hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'});
const dayKey = iso => new Date(iso).toLocaleDateString('en-US',
  {weekday:'short',month:'short',day:'numeric',timeZone:'America/Los_Angeles'});

function toPlain(html){
  if(!html) return '';
  let s = String(html);
  const cut = s.indexOf('<table');
  if(cut>-1) s = s.slice(0,cut);
  return s.replace(/<\/p>/gi,'\n\n').replace(/<br\s*\/?>/gi,'\n')
    .replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/\n{3,}/g,'\n\n').trim();
}
function toHtml(plain){
  return String(plain||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)
    .map(p=>'<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 14px 0;">'
      + esc(p).replace(/\n/g,'<br>') + '</p>').join('');
}

/* ================= auth ================= */
function renderLogin(msg){
  app.innerHTML = `<div class="center"><form class="loginbox" id="lf">
    <span class="wordmark">HAGGERT<span>Y</span></span>
    <span class="eyebrow">Marketing hub</span>
    <div class="field"><label for="em">Email</label><input type="text" id="em" autocomplete="username"/></div>
    <div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password"/></div>
    ${msg?`<p class="hint err" style="margin-top:14px">${esc(msg)}</p>`:''}
    <button class="btn" type="submit">Sign in</button></form></div>`;
  document.getElementById('lf').addEventListener('submit', async e=>{
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({
      email:document.getElementById('em').value.trim(),
      password:document.getElementById('pw').value });
    if(error) return renderLogin(error.message);
    boot();
  });
}

/* ================= loaders ================= */
async function loadBoard(){
  const { data, error } = await sb.from('v_today_board').select('*')
    .eq('queue_date', today()).order('vertical_order').order('slot');
  if(error) throw error;
  S.board = data || [];
  S.drafts = {};
  if(S.board.length){
    const { data:d } = await sb.from('email_drafts').select('*')
      .in('queue_id', S.board.map(r=>r.queue_id)).order('variant_number');
    for(const x of (d||[])) (S.drafts[x.queue_id] ||= []).push(x);
  }
  if(!S.activeId || !S.board.some(r=>r.queue_id===S.activeId)){
    const next = S.board.find(r=>!r.handled) || S.board[0];
    S.activeId = next ? next.queue_id : null;
    S.open = {};
    const f = S.activeId && S.drafts[S.activeId]?.[0];
    if(f) S.open[f.id] = true;
  }
  S.loaded.board = true;
}

async function loadTiles(){
  const { data } = await sb.from('v_dash_tiles').select('*').order('sort_order');
  S.tiles = data || [];
  S.loaded.tiles = true;
}

async function loadWeek(){
  const { data } = await sb.from('v_dash_week').select('*');
  S.week = data || [];
  S.loaded.week = true;
}

async function loadMetrics(){
  const [head, daily, vert, variant, pipe, cover, recent, weekT] = await Promise.all([
    sb.from('v_dash_headline').select('*').single(),
    sb.from('v_dash_daily').select('*'),
    sb.from('v_email_vertical_stats').select('*'),
    sb.from('v_variant_performance').select('*'),
    sb.from('v_dash_pipeline').select('*'),
    sb.from('v_vertical_coverage').select('*'),
    sb.from('v_dash_recent').select('*'),
    sb.from('v_dash_week_totals').select('*').single()
  ]);
  S.metrics = {
    head: head.data || {}, daily: daily.data || [], vert: vert.data || [],
    variant: variant.data || [], pipe: pipe.data || [], cover: cover.data || [],
    recent: recent.data || [], weekT: weekT.data || {}
  };
  S.loaded.metrics = true;
}

async function loadTasks(){
  const [t, st] = await Promise.all([
    sb.from('tasks').select('*').eq('work_date', today())
      .order('status').order('priority').order('sort_order'),
    sb.from('v_day_status').select('*').eq('work_date', today())
  ]);
  S.tasks = t.data || [];
  S.dayStatus = (st.data && st.data[0]) || null;
  S.loaded.tasks = true;
}

async function ensure(page){
  if(page==='today'){
    if(!S.loaded.board) await loadBoard();
    if(!S.loaded.week) await loadWeek();
    if(!S.loaded.tasks) await loadTasks();
  }
  if(page==='outreach'){
    if(!S.loaded.tiles) await loadTiles();
    if(!S.loaded.metrics) await loadMetrics();
  }
  if(page==='calendar' && !S.loaded.week) await loadWeek();
  if((page==='pipeline'||page==='kpis') && !S.loaded.metrics) await loadMetrics();
  if(page==='myday' && !S.loaded.tasks) await loadTasks();
}

/* ================= chrome ================= */
function topbar(){
  const done = S.board.filter(r=>r.handled).length;
  return `<header class="topbar">
    <span class="wordmark">HAGGERT<span>Y</span></span>
    <nav class="tabs">
      ${PAGES.map(([k,l])=>`<button class="tab ${S.page===k?'on':''}" data-page="${k}">${l}</button>`).join('')}
    </nav>
    <span class="spacer"></span>
    <span class="tally">${esc(prettyDate())}</span>
    ${S.board.length?`<span class="tally"><b>${done}</b> / ${S.board.length} cleared</span>`:''}
    <button class="linkbtn" id="signout">Sign out</button>
  </header>`;
}

function wireChrome(){
  document.querySelectorAll('[data-page]').forEach(el=>
    el.addEventListener('click', async ()=>{
      S.page = el.dataset.page; S.err=''; S.gen='';
      render();
      await ensure(S.page);
      render();
    }));
  const b = document.getElementById('signout');
  if(b) b.addEventListener('click', async ()=>{ await sb.auth.signOut(); renderLogin(); });
}

function render(){
  let inner = '';
  if(S.page==='today')     inner = pageToday();
  if(S.page==='outreach')  inner = pageOutreach();
  if(S.page==='calendar')  inner = pageCalendar();
  if(S.page==='pipeline')  inner = pagePipeline();
  if(S.page==='kpis')      inner = pageKpis();
  if(S.page==='myday')     inner = pageMyDay();
  app.innerHTML = topbar() + inner;
  wireChrome();
  wirePage();
}

function wirePage(){
  document.querySelectorAll('[data-row]').forEach(el=>
    el.addEventListener('click',()=>{
      S.activeId = el.dataset.row; S.open={}; S.err='';
      const f = S.drafts[S.activeId]?.[0]; if(f) S.open[f.id]=true;
      render();
    }));
  document.querySelectorAll('[data-toggle]').forEach(el=>
    el.addEventListener('click',()=>{ const id=el.dataset.toggle; S.open[id]=!S.open[id]; render(); }));
  document.querySelectorAll('[data-use]').forEach(el=>
    el.addEventListener('click',()=>useDraft(el.dataset.use)));
  document.querySelectorAll('[data-gen]').forEach(el=>
    el.addEventListener('click',()=>generate(Number(el.dataset.gen), 5)));
  const all = document.getElementById('genAll');
  if(all) all.addEventListener('click', generateAcross);
  const add = document.getElementById('addTask');
  if(add) add.addEventListener('click', addTask);
  const ti = document.getElementById('taskTitle');
  if(ti) ti.addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });
  document.querySelectorAll('[data-task-toggle]').forEach(el=>
    el.addEventListener('click',()=>cycleTask(el.dataset.taskToggle)));
  document.querySelectorAll('[data-task-del]').forEach(el=>
    el.addEventListener('click',()=>delTask(el.dataset.taskDel)));
  const ex = document.getElementById('exportCsv');
  if(ex) ex.addEventListener('click', exportCsv);
  const pr = document.getElementById('printPage');
  if(pr) pr.addEventListener('click', ()=>window.print());
}

function detailHtml(){
  const r = S.board.find(x=>x.queue_id===S.activeId);

  const drafts = S.drafts[r.queue_id]||[];
  const chips = [
    r.vertical && `<span class="chip">${esc(r.vertical)}</span>`,
    r.territory && `<span class="chip">${esc(r.territory)}</span>`,
    r.company_city && `<span class="chip">${esc(r.company_city)}${r.company_state?', '+esc(r.company_state):''}</span>`,

  const ctx = r.company_description || r.company_keywords || r.company_industry;

/* ================= actions ================= */
async function useDraft(draftId){
  if(S.busy) return;
  const r = S.board.find(x=>x.queue_id===S.activeId);
  const d = (S.drafts[r.queue_id]||[]).find(x=>x.id===draftId);
  if(!r||!d) return;
  const subject = document.getElementById('s-'+draftId).value.trim();
  const bodyText = document.getElementById('b-'+draftId).value.trim();
  if(!subject||!bodyText){ S.err='Add a subject and a message before sending.'; return render(); }

  S.busy=true; S.err=''; render();
  try{
    const greeting = '<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 14px 0;">Hi '
      + esc(r.first_name || (r.full_name||'').split(' ')[0]) + ',</p>';
    const signoff = '<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 4px 0;">Pat</p>';
    const sigStart = (d.body_html||'').indexOf('<table');
    const signature = sigStart>-1 ? d.body_html.slice(sigStart) : '';

    const { error:upErr } = await sb.from('email_drafts')
      .update({ edited_subject:subject, edited_body:greeting+toHtml(bodyText)+signoff+signature })
      .eq('id', draftId);
    if(upErr) throw upErr;

    const res = await fetch(ACTION_URL,{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({queue_id:r.queue_id, draft_id:draftId})});
    const out = await res.json().catch(()=>({}));
    if(!res.ok||!out.ok) throw new Error(out.error||'Could not create the draft. It may already have been handled.');

    await loadBoard();
    S.loaded.metrics=false; S.loaded.tiles=false;
  }catch(err){ S.err = err.message||String(err); }
  finally{ S.busy=false; render(); }
}

async function generate(verticalId, count){
  if(S.busy) return;
  S.busy=true; S.gen='Pulling contacts and writing drafts, this takes about a minute…'; render();
  try{
    const res = await fetch(GENERATE_URL,{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({vertical_id:verticalId, count:count})});
    const out = await res.json().catch(()=>({}));
    S.gen = out.ok ? `Queued ${out.queued}. Open the Today tab to work through them.`
                   : (out.error || 'Nothing eligible in that sector right now.');
    S.loaded.board=false; S.loaded.tiles=false; S.loaded.metrics=false;
    await loadTiles(); await loadBoard();
  }catch(err){ S.gen = 'That did not go through: ' + (err.message||err); }
  finally{ S.busy=false; render(); }
}

async function generateAcross(){
  if(S.busy) return;
  const live = (S.tiles||[]).filter(t=>Number(t.pool)>0);
  if(!live.length){ S.gen='No sector has eligible contacts right now.'; return render(); }
  S.busy=true; S.gen=`Pulling two from each of ${live.length} sectors…`; render();
  let total = 0;
  try{
    for(const t of live){
      const res = await fetch(GENERATE_URL,{method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({vertical_id:t.vertical_id, count:2})});
      const out = await res.json().catch(()=>({}));
      if(out.ok) total += Number(out.queued||0);
    }
    S.gen = `Queued ${total} across ${live.length} sectors. Open the Today tab to work through them.`;
    S.loaded.board=false; S.loaded.tiles=false; S.loaded.metrics=false;
    await loadTiles(); await loadBoard();
  }catch(err){ S.gen = 'Stopped partway: ' + (err.message||err); }
  finally{ S.busy=false; render(); }
}

async function addTask(){
  const el = document.getElementById('taskTitle');
  const title = el.value.trim();
  if(!title){ el.focus(); return; }
  const category = document.getElementById('taskCat').value;
  const priority = Number(document.getElementById('taskPri').value);
  S.err='';
  try{
    const { error } = await sb.from('tasks').insert({
      title, category, priority, owner:'liam',
      work_date: today(), sort_order: (S.tasks||[]).length
    });
    if(error) throw error;
    await loadTasks(); render();
    const n = document.getElementById('taskTitle'); if(n) n.focus();
  }catch(err){ S.err = err.message||String(err); render(); }
}

async function cycleTask(id){
  const t = (S.tasks||[]).find(x=>x.id===id);
  if(!t) return;
  const next = t.status==='open' ? 'doing' : (t.status==='doing' ? 'done' : 'open');
  try{
    await sb.from('tasks').update({ status: next }).eq('id', id);
    await loadTasks(); render();
  }catch(err){ S.err = err.message||String(err); render(); }
}

async function delTask(id){
  try{
    await sb.from('tasks').delete().eq('id', id);
    await loadTasks(); render();
  }catch(err){ S.err = err.message||String(err); render(); }
}

function exportCsv(){
  const m = S.metrics; if(!m) return;
  const rows = [];
  const push = (...cells) => rows.push(cells.map(c => {
    const s = String(c ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(','));

  push('HAGGERTY marketing summary', prettyDate());
  push('');
  push('Headline');
  const h = m.head;
  push('Sent 30 days', h.sent_30d); push('Replies 30 days', h.replied_30d);
  push('Reply rate %', h.reply_rate_30d); push('Send-through %', h.send_through_30d);
  push('Bounced', h.bounced_30d); push('Open deals', h.open_deals);
  push('Open value', h.open_value); push('Engaged contacts', h.engaged_contacts);
  push('');
  push('Daily'); push('Day','Drafted','Sent','Replied','Bounced');
  m.daily.forEach(d=>push(d.day,d.drafted,d.sent,d.replied,d.bounced));
  push('');
  push('By sector'); push('Sector','Drafted','Sent','Replied','Reply rate %');
  m.vert.forEach(v=>push(v.vertical,v.drafted,v.sent,v.replied,v.reply_rate_pct));
  push('');
  push('By approach'); push('Approach','Chosen','Sent','Replied','Reply rate %');
  m.variant.forEach(v=>push(LABELS[v.variant_type]||v.variant_type,
    v.times_selected,v.times_sent,v.replied,v.reply_rate_pct));
  push('');
  push('Pipeline'); push('Stage','Deals','Value');
  m.pipe.forEach(p=>push(p.stage,p.deals,p.value));

  const blob = new Blob([rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'haggerty-marketing-' + today() + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= boot ================= */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return renderLogin();
  try{
    await ensure('today');
    render();
  }catch(e){
    app.innerHTML = topbar() + `<div class="empty"><h2>Could not load</h2>
      <p>${esc(e.message||e)}</p>
      <p class="hint" style="margin-top:12px">If this mentions permissions, your account may not have access yet.</p></div>`;
    wireChrome();
  }
}
boot();
